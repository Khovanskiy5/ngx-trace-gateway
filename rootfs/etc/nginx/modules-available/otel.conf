##
# otel.conf — загрузка модуля OpenTelemetry (главный контекст).
#
# Модуль есть только в образах nginx *-otel (например, nginx:1.30.5-otel)
# и в полном образе Angie; в OpenResty официального OTel-модуля нет.
# Включение:
#   1) в .env: NGX_IMAGE=nginx:1.30.5-otel, NGX_BIN=nginx
#      (или docker.angie.software/angie:1.12.2, NGX_BIN=angie);
#   2) скопируйте этот файл в modules-enabled/ и оставьте строку для своего образа;
#   3) раскомментируйте `include /etc/nginx/snippets/otel.conf;` в main.d/http.conf.
# Пути абсолютные: каталог /etc/nginx смонтирован целиком, и ссылка
# /etc/nginx/modules из образа nginx недоступна.
##

# nginx *-otel:
load_module /usr/lib/nginx/modules/ngx_otel_module.so;

# Angie:
# load_module /usr/lib/angie/modules/ngx_otel_module.so;
