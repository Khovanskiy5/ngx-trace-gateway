############################################################
# catch_all.conf — серверы по умолчанию для неизвестных Host и SNI.
#
# Запросы по IP, с чужим Host или без Host не должны попадать на реальный
# сайт: иначе злоумышленник подставляет свой Host в редиректы и ссылки
# (host header poisoning), а сканеры по IP видят сайт и его сертификат.
#   HTTP  → 444: nginx закрывает соединение без ответа;
#   HTTPS → ssl_reject_handshake: TLS-рукопожатие отклоняется ещё до выдачи
#           сертификата (свой сертификат этому серверу не нужен).
# Сами запросы попадают в JSON-лог — сканеры остаются видны.
#
# Серверы разделены: на порту 80 HTTP/2 не включаем (иначе default_server
# разрешил бы h2c «prior knowledge» для всех сайтов без TLS).
############################################################

server {
    include /etc/nginx/snippets/listen_http_default.conf;
    server_name _;

    # Ошибки разбора запроса (400, 414, 494 — слишком длинные заголовки)
    # возникают до выбора сайта и обрабатываются этим сервером: отдаём
    # страницу с ID запроса, а не встроенную страницу nginx.
    include /etc/nginx/snippets/error_pages.conf;

    location / {
        return 444;
    }
}

server {
    include /etc/nginx/snippets/listen_https_default.conf;

    # HTTP/3: reuseport указывается один раз на адрес:порт — здесь.
    # listen 443 quic reuseport default_server;
    # listen [::]:443 quic reuseport default_server;

    http2 on;
    server_name _;

    ssl_reject_handshake on;

    return 444;
}
