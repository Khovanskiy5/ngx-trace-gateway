############################################################
# default_https.conf — сборка демо-сайта с HTTPS.
#
#   80  → только ACME HTTP-01 и 301 на https://;
#   443 → сайт (HTTP/2, HSTS).
#
# Перед включением положите сертификат и ключ (пути — в https_server.conf).
# Для локальной разработки: `make certs` (самоподписанный сертификат для localhost).
############################################################

include /etc/nginx/sites-available/default/upstream.conf;
include /etc/nginx/sites-available/default/http_redirect_server.conf;
include /etc/nginx/sites-available/default/https_server.conf;
