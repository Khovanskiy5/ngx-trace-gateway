############################################################
# app_redirects_security.conf — защита и каноничные URL сайта.
# Подключается в server{} ПЕРВЫМ (до location со статикой).
#
#   1) Запрет служебных файлов: .git, .env, резервные копии, ключи,
#      конфиги PHP-приложений, скрипты в каталогах загрузок.
#   2) 301 на каноничный URL страниц: /index.html → /, пустой «?»,
#      повторные слеши. Только GET/HEAD, не для /api/ и /.well-known/,
#      относительный Location, цель — из «сырого» $request_uri (без
#      HTTP response splitting и open redirect).
#   3) Режим обслуживания (файл /var/www/maintenance/on).
#
# Чего здесь больше нет и почему:
#   - добавления «/» к путям без расширения: оно ломало API (POST → GET),
#     ACME-проверку и /healthz, а для настоящих каталогов nginx делает этот
#     редирект сам;
#   - блокировки по регуляркам SQLi/XSS в query-строке: много ложных
#     срабатываний (поиск «concat(», диапазоны «a..b») и простые обходы.
#     Теперь такие запросы только помечаются в логе (global_security.conf);
#   - запрета «..» и /etc|/var в URI: nginx сам нормализует путь и не выпускает
#     его за пределы root, а правило блокировало легальные адреса;
#   - запрета всего каталога /uploads/ и архивов .zip/.tar.gz: блокировались
#     обычные картинки и скачивания.
############################################################

include /etc/nginx/snippets/deny_sensitive_files.conf;
include /etc/nginx/snippets/canonical_redirects.conf;
include /etc/nginx/snippets/maintenance.conf;
