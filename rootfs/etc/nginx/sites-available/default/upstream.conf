############################################################
# upstream.conf — группа бэкендов демо-сайта.
#
# В compose.yaml бэкенд — сервис `backend` (traefik/whoami: возвращает
# заголовки запроса, удобно смотреть трассировку). Замените на свои серверы.
############################################################

upstream backend_upstream {
    # Общая память для состояния группы: счётчики max_fails и позиция
    # балансировки едины для всех воркеров. Обязательна для `resolve`.
    zone backend_upstream 256k;

    # --- Метод балансировки (до keepalive) ------------------------------
    # По умолчанию — weighted round-robin. Альтернативы:
    #   least_conn;                          — на сервер с наименьшим числом соединений;
    #   ip_hash;                             — «липкие» сессии по IP клиента;
    #   hash $cookie_session_id consistent;  — «липкие» сессии по cookie;
    #   random two least_conn;               — случайные два, из них менее загруженный.
    # ВНИМАНИЕ: ip_hash, hash и random несовместимы с параметром `backup`.

    # --- DNS для `resolve` -------------------------------------------------
    # Имена серверов перечитываются во время работы (nginx ≥ 1.27.3, OpenResty
    # ≥ 1.27.3.1, Angie). Если имя пока не резолвится, nginx всё равно
    # стартует и начнёт слать запросы, когда адрес появится.
    # DNS-сервер задан глобально: conf.d/globals/global_resolver.conf.

    # --- Серверы -----------------------------------------------------------
    # max_fails/fail_timeout: после 3 неудач (ошибка соединения или таймаут)
    # за 10 с сервер исключается на 10 с. Держите значения умеренными:
    # таймауты медленных запросов тоже считаются неудачами.
    server backend:8080 resolve max_fails=3 fail_timeout=10s;

    # Примеры статических адресов:
    # server 10.0.0.1:9000 weight=5 max_fails=3 fail_timeout=10s;   # мощный узел
    # server 10.0.0.2:9000 max_fails=3 fail_timeout=10s;
    # server 10.0.0.4:9000 backup;   # получает ВЕСЬ трафик, когда основные недоступны

    # --- Keepalive к бэкендам ----------------------------------------------
    # Пул простаивающих соединений на каждый воркер. Для переиспользования
    # нужны proxy_http_version 1.1 и пустой Connection — оба уже заданы
    # глобально (global_proxy.conf, main.d/http.conf), в location ничего добавлять
    # не нужно. В Angie без этой строки соединения не переиспользуются.
    keepalive 32;

    # keepalive_timeout должен быть МЕНЬШЕ idle-таймаута бэкенда, иначе
    # возможны редкие 502 на POST: бэкенд закрыл соединение, а nginx как раз
    # отправил в него запрос. 4 с — ниже значения Node.js по умолчанию (5 с).
    # Если у бэкенда таймаут больше (Go, Java, Node с keepAliveTimeout=65 с),
    # поднимите значение чуть ниже него. gunicorn с sync-воркерами keepalive
    # не поддерживает — для него уберите строку keepalive выше.
    keepalive_timeout  4s;
    keepalive_requests 1000;
}
