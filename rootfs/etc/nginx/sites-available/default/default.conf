############################################################
# default.conf — сборка демо-сайта: только HTTP (порт 80).
#
# Подключается из sites-enabled/default.conf. Чтобы включить HTTPS
# (нужен сертификат, см. README → «HTTPS»), замените там
#     default/default.conf  →  default/default_https.conf
#
# Состав сайта:
#   upstream.conf                 — группа бэкендов backend_upstream (http-контекст);
#   http_server.conf              — server{} на 80 порту;
#   app_redirects_security.conf   — защита служебных файлов, каноничные URL,
#                                   режим обслуживания (подключается в server{});
#   app_locations.conf            — location сайта и API, общие для HTTP и HTTPS.
#
# Если копируете каталог для второго сайта, переименуйте upstream
# (например, site2_backend): имена upstream и map глобальны для всего http{}.
# Это делает scripts/new-site.sh.
############################################################

include /etc/nginx/sites-available/default/upstream.conf;
include /etc/nginx/sites-available/default/http_server.conf;
