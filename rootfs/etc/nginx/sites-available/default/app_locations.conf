############################################################
# app_locations.conf — location демо-сайта, общие для HTTP и HTTPS.
# Подключается в server{} после app_redirects_security.conf.
############################################################

root  /var/www/default/public;
index index.html;

# --- Страницы сайта --------------------------------------------------------
location / {
    # Кодировку объявляем только для своих файлов, не для проксируемых ответов.
    charset utf-8;
    try_files $uri $uri/ =404;
}

# --- PHP в статическом сайте не исполняется --------------------------------
# Без обработчика .php отдавался бы как файл — с исходным кодом и паролями.
# Если сайт на PHP, замените на location с snippets/fastcgi_php.conf.
location ~* \.(?:php[0-9]?|phtml|phar)$ {
    return 404;
}

# --- Статика ----------------------------------------------------------------
# Никаких add_header здесь нет: `expires` сам выставляет Cache-Control
# (max-age) и Expires, а заголовки безопасности и трассировки наследуются.
location ~* \.(?:css|js|mjs|map|jpe?g|gif|png|ico|webp|avif|svg|woff2?|ttf|otf|eot|webmanifest)$ {
    charset       utf-8;
    charset_types text/css application/javascript;
    access_log    off;   # меньше шума; ошибки (404) всё равно попадут в лог через error_page
    expires       30d;
    try_files     $uri =404;
}

# --- Служебные файлы --------------------------------------------------------
location = /favicon.ico {
    access_log    off;
    log_not_found off;
    try_files     $uri =204;
}

location = /robots.txt {
    access_log    off;
    log_not_found off;
    charset       utf-8;
}

# Chrome DevTools запрашивает /.well-known/appspecific/com.chrome.devtools.json.
location ^~ /.well-known/appspecific/ {
    access_log off;
    return 204;
}

# --- API: проксирование в upstream-группу -----------------------------------
# Заголовки трассировки и X-Forwarded-* выставляются глобально
# (snippets/proxy_headers.conf). Методы не ограничиваем: PUT/PATCH/DELETE и
# CORS-preflight OPTIONS решает бэкенд. Слеш не добавляется, редиректов нет.
location ^~ /api/ {
    # Не больше 50 одновременных соединений и в среднем 10 запросов в секунду
    # с одного IP (зоны — в global_rate_limit.conf). Превышение → 429.
    limit_conn perip_conn 50;
    limit_req  zone=public_api_ip burst=40 delay=20;

    # Явный лимит тела запроса для API: превышение — 413 в JSON.
    client_max_body_size 16m;

    # Ошибки шлюза (502/504/429/413 …) для /api/ отдаются в JSON с request_id:
    # страницу выбирает map $error_page_uri (global_error_pages.conf).
    # Для других префиксов API добавьте их в тот map или подключите в location
    # snippets/api_error_pages.conf.

    # Cache-Control: no-store, если бэкенд не задал кэширование сам.
    include /etc/nginx/snippets/api_headers.conf;

    proxy_pass http://backend_upstream;
}

# --- Примеры ------------------------------------------------------------------
# WebSocket:
# location /ws/ {
#     include /etc/nginx/snippets/websocket.conf;
#     proxy_pass http://backend_upstream;
# }
#
