############################################################
# http_server.conf — демо-сайт по HTTP (порт 80).
############################################################

server {
    # listen 80 и [::]:80. Для хостов без IPv6 — правка в одном файле snippets/listen_*.conf.
    include /etc/nginx/snippets/listen_http.conf;

    # Имена, по которым сайт доступен. Всё остальное отсекает catch-all
    # (sites-available/catch_all.conf). Замените на свой домен.
    server_name localhost 127.0.0.1;

    # Порядок важен:
    #   1) error_pages.conf — первым: он фиксирует исходный запрос для лога
    #      до любых return в фазе rewrite (режим обслуживания, редиректы);
    #   2) app_redirects_security.conf — запреты служебных файлов (регулярные
    #      location) должны стоять раньше location со статикой.
    include /etc/nginx/snippets/error_pages.conf;
    include /etc/nginx/sites-available/default/app_redirects_security.conf;
    include /etc/nginx/snippets/acme_challenge.conf;
    include /etc/nginx/sites-available/default/app_locations.conf;
}
