############################################################
# http_redirect_server.conf — порт 80 при включённом HTTPS:
# ACME HTTP-01 и 301 на https:// для всего остального.
############################################################

server {
    include /etc/nginx/snippets/listen_http.conf;

    # Те же имена, что в https_server.conf. Если включаете шаблон
    # www → apex, добавьте сюда и www-имя (http://www → https://www → https://apex).
    # IP-адреса здесь не указываем: TLS по IP-адресу работает без SNI,
    # и такое соединение отклонит catch-all сервер.
    server_name localhost;

    include /etc/nginx/snippets/acme_challenge.conf;
    include /etc/nginx/snippets/redirect_to_https.conf;
}
