############################################################
# https_server.conf — демо-сайт по HTTPS (порт 443, HTTP/2).
# Включается через default_https.conf.
############################################################

server {
    include /etc/nginx/snippets/listen_https.conf;
    http2 on;

    # Только доменные имена: клиенты не отправляют SNI для IP-адресов, а
    # без SNI соединение принимает catch-all сервер и отклоняет его.
    server_name localhost;

    # Сертификат с цепочкой и ключ. Локально: `make certs`. В продакшене —
    # certbot/lego (webroot /var/www/acme), ACME-модуль образов nginx или
    # встроенный ACME-клиент Angie. Сертификаты живут всё меньше
    # (CA/B Forum SC-081: до 47 дней к 2029 году), поэтому выпуск
    # обязательно автоматизируйте.
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # HSTS отдельно подключать не нужно: он входит в общий набор заголовков
    # (snippets/security_headers.conf) и отправляется на всех HTTPS-ответах,
    # включая API и страницы ошибок.

    # По желанию:
    # include /etc/nginx/snippets/http3.conf;          # HTTP/3 (QUIC)
    # include /etc/nginx/snippets/ocsp_stapling.conf;  # только для CA с OCSP

    include /etc/nginx/snippets/error_pages.conf;
    include /etc/nginx/sites-available/default/app_redirects_security.conf;
    include /etc/nginx/sites-available/default/app_locations.conf;
}

