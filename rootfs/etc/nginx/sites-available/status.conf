######################################################################
# status.conf — служебный сервер: здоровье и метрики nginx.
# Включается файлом sites-enabled/01-status.conf.
#
# Слушает только 127.0.0.1:8080 внутри контейнера и наружу не публикуется.
#   GET /healthz       — liveness: nginx принимает запросы (healthcheck в compose.yaml);
#   GET /readyz        — readiness (при необходимости добавьте свои проверки);
#   GET /nginx_status  — stub_status: соединения и запросы.
#
# Проверка: `make status` и `make health` (в образах разный набор утилит:
# curl, wget или только bash — цели Makefile выбирают доступную).
#
# Экспортер Prometheus (nginx-prometheus-exporter) запускайте в сетевом
# пространстве шлюза, тогда ему доступен 127.0.0.1:
#   network_mode: "service:gateway"
#   command: ["--nginx.scrape-uri=http://127.0.0.1:8080/nginx_status"]
# Открывать этот порт наружу или на всю docker-сеть не нужно: на Docker
# Desktop и за NAT внешний трафик приходит с приватных адресов, и ACL по
# RFC 1918 никого бы не отсёк. В Angie вместо stub_status есть API /status.
######################################################################

server {
    listen 127.0.0.1:8080;
    server_name _;

    access_log off;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}\n';
    }

    location = /readyz {
        default_type application/json;
        return 200 '{"status":"ready"}\n';
    }

    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny  all;
    }

    location / {
        return 404;
    }
}
