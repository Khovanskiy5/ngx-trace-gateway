##
# GLOBAL TRACE — идентификаторы запроса и цепочка hop'ов.
#
# Публичные переменные (их используют логи, заголовки и бэкенды):
#   $trace_request_id    — сквозной ID запроса (X-Request-ID);
#   $local_request_id    — ID запроса на этом узле ($request_id, 32 hex);
#   $prev_request_id     — ID предыдущего hop'а (входящий X-Prev-Request-ID);
#   $current_hop         — «hop_name:local_request_id» этого узла;
#   $incoming_chain      — проверенная входящая цепочка (X-Request-Chain);
#   $request_hops_chain  — цепочка с добавленным текущим hop'ом;
#   $mobile_launch_id    — ID запуска мобильного приложения (X-Mobile-Launch-ID);
#   $mobile_request_id   — ID мобильного запроса (X-Mobile-Request-ID);
#   $trace_id_source     — откуда взят trace ID: header | traceparent | generated;
#   $traceparent_trace_id / $traceparent_parent_id — поля W3C traceparent.
#
# Все входящие значения приходят от клиента, поэтому проверяются здесь:
#   ID       — ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ (32 hex, UUID, ULID и т. п.);
#              неподходящее значение отбрасывается (для trace ID генерируется новый);
#   цепочка  — не больше 16 элементов «hop:id» через «, »; длиннее — остаются
#              последние 15 за маркером «~»; мусор заменяется на «~».
# Так в заголовки и JSON-лог никогда не попадают кавычки, управляющие символы,
# невалидный UTF-8 и значения размером в килобайты.
#
# «Пустой» заголовок и отсутствующий заголовок для nginx — одно и то же:
# add_header и proxy_set_header с пустым значением не отправляются.
#
# Регулярные выражения используют только именованные захваты с уникальными
# именами и не смешивают их с другими map-переменными в одной строке: так
# конфигурация не подвержена CVE-2026-42533 даже на сборках без исправления
# (OpenResty 1.31.1.1 основан на nginx 1.31.1).
##

# ---------------------------------------------------------------------
# 1) Проверка входящих ID
# ---------------------------------------------------------------------
map $http_x_request_id $trace_in_request_id {
    default                                  "";
    "~^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"   $http_x_request_id;
}

# Доверие к hop'ам клиента. X-Request-Chain и X-Prev-Request-ID описывают
# узлы ДО шлюза и ничем не подписаны. По контракту (docs/developer-guide.md)
# мобильные и веб-клиенты добавляют в цепочку свой hop, поэтому по умолчанию
# проверенные значения принимаются от любого клиента (default 1) — как
# справочные данные, не как доказательство.
# Если перед шлюзом нет таких клиентов (например, это внутренний hop за
# своим edge), разрешите их только доверенным сетям: default 0 и список сетей
# (адрес — $remote_addr, после realip). От остальных цепочка заменяется
# маркером «~», а X-Prev-Request-ID отбрасывается.
geo $trace_accept_client_hops {
    default          1;
    # 10.0.0.0/8     1;
}

# X-Prev-Request-ID: «кто был до меня». Сами не генерируем: нет заголовка — пусто.
map "$trace_accept_client_hops:$http_x_prev_request_id" $prev_request_id {
    default                                                      "";
    "~^1:(?<prev_request_in>[A-Za-z0-9][A-Za-z0-9._:-]{0,127})$" $prev_request_in;
}

# mobile_launch_id — один запуск мобильного приложения (генерирует клиент при старте).
map $http_x_mobile_launch_id $mobile_launch_id {
    default                                  "";
    "~^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"   $http_x_mobile_launch_id;
}

# mobile_request_id — один HTTP-запрос мобильного клиента (новый на каждый запрос).
map $http_x_mobile_request_id $mobile_request_id {
    default                                  "";
    "~^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"   $http_x_mobile_request_id;
}

# ---------------------------------------------------------------------
# 2) W3C Trace Context (только чтение)
# ---------------------------------------------------------------------
# traceparent: 00-<trace-id 32 hex>-<parent-id 16 hex>-<flags 2 hex>.
# Разбираем только версию 00; нулевые trace-id/parent-id по спецификации
# недействительны. Сам nginx traceparent НЕ генерирует и не меняет: заголовки
# traceparent/tracestate уходят к бэкенду как пришли. Синтетический traceparent
# изменил бы решение о семплировании во всех сервисах ниже (флаг 01 включил бы
# 100% трассировку, 00 — выключил бы её) и породил бы спаны с несуществующим
# родителем. Полноценные спаны — задача ngx_otel_module (образы nginx *-otel,
# Angie); в OpenResty официального OTel-модуля нет.
map $http_traceparent $traceparent_trace_id {
    default                                                                   "";
    "~^00-(?!0{32})(?<tp_trace_id>[0-9a-f]{32})-(?!0{16})[0-9a-f]{16}-[0-9a-f]{2}$"   $tp_trace_id;
}

map $http_traceparent $traceparent_parent_id {
    default                                                                   "";
    "~^00-(?!0{32})[0-9a-f]{32}-(?!0{16})(?<tp_parent_id>[0-9a-f]{16})-[0-9a-f]{2}$"  $tp_parent_id;
}

# ---------------------------------------------------------------------
# 3) Сквозной trace ID: X-Request-ID → trace-id из traceparent → свой $request_id
# ---------------------------------------------------------------------
# Разделитель «|» выбран потому, что его нет в допустимом алфавите ID.
# $request_id — 32 hex, тот же формат, что у W3C trace-id.
map "$trace_in_request_id|$traceparent_trace_id" $trace_request_id {
    "~^(?<trid_header>[^|]+)\|"          $trid_header;
    "~^\|(?<trid_w3c>[0-9a-f]{32})$"     $trid_w3c;
    default                              $request_id;
}

map "$trace_in_request_id|$traceparent_trace_id" $trace_id_source {
    "~^[^|]+\|"   header;
    "~^\|.+$"     traceparent;
    default       generated;
}

# ---------------------------------------------------------------------
# 4) Локальный ID и текущий hop
# ---------------------------------------------------------------------
# Локальный hop-ID этого nginx: всегда свой уникальный $request_id.
map $request_id $local_request_id {
    default $request_id;
}

# Текущий hop: «hop_name:local_request_id», например «edge-gateway:4f2a…».
# $hop_name задаётся в global_hop_name.conf.
map "$hop_name:$local_request_id" $current_hop {
    default "$hop_name:$local_request_id";
}

# ---------------------------------------------------------------------
# 5) Цепочка hop'ов (X-Request-Chain)
# ---------------------------------------------------------------------
# Элемент: hop [A-Za-z0-9._-]{1,64} + «:» + id [A-Za-z0-9._:-]{1,128};
# элементы разделяются «, ». Порядок проверок:
#   - пусто — мы первый hop;
#   - до 16 корректных элементов — принимаем как есть;
#   - иначе берём корректный «хвост» (до 15 последних элементов) за маркером «~»,
#     чтобы с нашим hop'ом цепочка не превысила 16 элементов (~3,3 КБ);
#   - ничего корректного — только маркер «~» (цепочка была, но отброшена).
# Сначала — проверка доверия ($trace_accept_client_hops выше).
map "$trace_accept_client_hops:$http_x_request_chain" $trace_chain_candidate {
    "0:"                          "";
    "1:"                          "";
    "~^1:(?<chain_candidate>.+)$" $chain_candidate;
    default                       "~";
}

map $trace_chain_candidate $incoming_chain {
    ""       "";
    "~^[A-Za-z0-9._-]{1,64}:[A-Za-z0-9._:-]{1,128}(?:, ?[A-Za-z0-9._-]{1,64}:[A-Za-z0-9._:-]{1,128}){0,15}$"
             $trace_chain_candidate;
    "~(?:^|, ?)(?<chain_tail>(?:[A-Za-z0-9._-]{1,64}:[A-Za-z0-9._:-]{1,128}, ?){0,14}[A-Za-z0-9._-]{1,64}:[A-Za-z0-9._:-]{1,128})$"
             "~, $chain_tail";
    default  "~";
}

# Дописываем себя в конец цепочки.
map $incoming_chain $request_hops_chain {
    ""       $current_hop;
    default  "$incoming_chain, $current_hop";
}

# ---------------------------------------------------------------------
# 6) Что показывать клиенту в ответе
# ---------------------------------------------------------------------
# X-Request-ID отдаётся всегда: по нему пользователь и поддержка находят запрос.
# Имя узла, цепочка и X-Prev-Request-ID раскрывают внутреннюю топологию,
# поэтому по умолчанию видны только клиентам с loopback-адресов.
# Приватные сети (10/8, 172.16/12, 192.168/16) сюда НЕ входят намеренно: при
# публикации порта Docker (Docker Desktop, userland-proxy), в Kubernetes с
# SNAT и за балансировщиком без realip ЛЮБОЙ внешний клиент приходит с
# приватного адреса. Добавляйте сети, только если адреса клиентов настоящие
# (realip настроен, SNAT нет). Цепочку, которую получил бэкенд, всегда видно
# в его логах, а в демо — в ответе /api/.
geo $trace_expose_internal {
    default          0;
    127.0.0.1/32     1;
    ::1/128          1;
    # 10.0.0.0/8     1;
}

map $trace_expose_internal $trace_resp_hop_name {
    1        $hop_name;
    default  "";
}

map $trace_expose_internal $trace_resp_prev_request_id {
    1        $prev_request_id;
    default  "";
}

# Если бэкенд тоже реализует протокол трассировки, он вернёт цепочку со своим
# hop'ом — она полнее нашей, и отдаём её (копию бэкенда скрывает
# proxy_hide_header, чтобы не было дублей). Условия:
#   - цепочка бэкенда корректна по тому же формату, что и входящая
#     (до 32 элементов: бэкенд мог добавить свои hop'ы);
#   - ответ свежий: при HIT/STALE/UPDATING/REVALIDATED это цепочка чужого
#     запроса, сохранённая в кэше, — тогда отдаём свою.
map $upstream_http_x_request_chain $trace_upstream_chain {
    ""       "";
    "~^(?:~, ?)?[A-Za-z0-9._-]{1,64}:[A-Za-z0-9._:-]{1,128}(?:, ?[A-Za-z0-9._-]{1,64}:[A-Za-z0-9._:-]{1,128}){0,31}$"
             $upstream_http_x_request_chain;
    default  "";
}

map "$trace_expose_internal|$upstream_cache_status|$trace_upstream_chain" $trace_resp_chain {
    "~^1\|(?:MISS|BYPASS|EXPIRED)?\|(?<upstream_chain>.+)$"   $upstream_chain;
    "~^1\|"                                                   $request_hops_chain;
    default                                                   "";
}
