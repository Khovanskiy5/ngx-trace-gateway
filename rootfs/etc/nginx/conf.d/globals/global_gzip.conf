##
# GLOBAL GZIP — сжатие текстовых ответов.
##

gzip on;

# 1–9: выше — сильнее сжатие и больше CPU. 5 — практичный компромисс.
gzip_comp_level 5;

# Маленькие ответы не сжимаем: выигрыш меньше накладных расходов.
gzip_min_length 1024;

# Vary: Accept-Encoding — чтобы кэши хранили сжатую и несжатую версии отдельно.
gzip_vary on;

# Сжимать и ответы на запросы, пришедшие через прокси/CDN.
gzip_proxied any;

# text/html сжимается всегда. Уже сжатые форматы (картинки, видео, шрифты
# woff/woff2, архивы) и text/event-stream (SSE) в список не входят.
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    text/markdown
    application/javascript
    application/json
    application/problem+json
    application/ld+json
    application/vnd.api+json
    application/manifest+json
    application/xml
    application/rss+xml
    application/atom+xml
    application/wasm
    image/svg+xml
    font/ttf
    font/otf;

# Отдавать заранее сжатые файлы file.css.gz рядом с file.css, если они есть.
gzip_static on;
