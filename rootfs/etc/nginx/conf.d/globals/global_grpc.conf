##
# GLOBAL GRPC — значения по умолчанию для grpc_pass.
#
# gRPC использует свои директивы (grpc_set_header и т. д.), поэтому без этого
# файла бэкенд за grpc_pass не получил бы ни трассировку, ни адрес клиента.
# Ошибки шлюза в формате gRPC — snippets/grpc_errors.conf.
##
grpc_connect_timeout 5s;
grpc_send_timeout    60s;
grpc_read_timeout    60s;   # для стримов увеличивайте в location

grpc_next_upstream       error timeout;
grpc_next_upstream_tries 2;
grpc_next_upstream_timeout 30s;

# TLS к бэкенду (grpcs://): проверяем сертификат и шлём SNI.
grpc_ssl_server_name         on;
grpc_ssl_verify              on;
grpc_ssl_verify_depth        3;
grpc_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
grpc_ssl_protocols           TLSv1.2 TLSv1.3;

include /etc/nginx/snippets/grpc_headers.conf;
