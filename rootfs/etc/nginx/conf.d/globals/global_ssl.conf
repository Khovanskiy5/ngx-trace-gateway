##
# GLOBAL SSL — TLS-политика для всех HTTPS-серверов.
#
# Профиль intermediate из TLSRef 6.0 (бывший Mozilla SSL Configuration
# Generator, https://configurator.tlsref.org/). Сертификаты задаются в
# конкретных server{} (см. sites-available/default/https_server.conf).
##

# TLS 1.2 и 1.3. Профиль modern — только TLSv1.3 (и без ssl_ciphers).
ssl_protocols TLSv1.2 TLSv1.3;

# Шифры для TLS 1.2: только ECDHE + AEAD. Для TLS 1.3 набор шифров задаёт
# OpenSSL, эта директива на него не влияет. DHE-шифров нет, поэтому
# ssl_dhparam не нужен.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# Все шифры в списке стойкие, поэтому выбор оставляем клиенту: он знает,
# есть ли у него аппаратный AES (иначе быстрее ChaCha20).
ssl_prefer_server_ciphers off;

# Группы обмена ключами не задаём (ssl_ecdh_curve auto): OpenSSL ≥ 3.5, который
# есть во всех поддерживаемых образах, сам предлагает первым постквантовый
# гибрид X25519MLKEM768, затем X25519 и P-256. Явный список TLSRef
# «X25519MLKEM768:X25519:prime256v1:secp384r1» ломает запуск на OpenSSL < 3.5.

# Кэш TLS-сессий: ~40 000 сессий на 10 МБ, общий для всех воркеров.
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# Session tickets оставлены включёнными (значение по умолчанию): с nginx 1.23.2
# ключи тикетов хранятся в общем кэше и автоматически ротируются.

# OCSP stapling выключен: см. snippets/ocsp_stapling.conf.
# Сжатие сертификатов TLS 1.3 (ssl_certificate_compression) оставлено
# выключенным: оно несовместимо со stapling, а в Angie даёт предупреждение.
