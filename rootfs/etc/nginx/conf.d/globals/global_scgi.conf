##
# GLOBAL SCGI — значения по умолчанию для scgi_pass.
# Параметры задаются в location: `include scgi_params;` +
# snippets/scgi_trace_params.conf.
##
scgi_connect_timeout 5s;
scgi_send_timeout    60s;
scgi_read_timeout    60s;

scgi_buffering         on;
scgi_buffer_size       16k;
scgi_buffers           16 16k;
scgi_busy_buffers_size 32k;

scgi_next_upstream       error timeout;
scgi_next_upstream_tries 2;
scgi_next_upstream_timeout 30s;   # не дольше 30 с на все попытки

scgi_temp_path /var/cache/nginx/scgi_temp;

# Скрытие заголовков ответа приложения (X-Powered-By и копии заголовков
# трассировки) — в snippets/scgi_hide_headers.conf. scgi_hide_header
# наследуется по правилу «всё или ничего»: если в location нужен свой
# scgi_hide_header, подключите туда этот snippet повторно.
include /etc/nginx/snippets/scgi_hide_headers.conf;

# Кэш SCGI — по аналогии с global_fastcgi.conf (scgi_cache_path + scgi_cache).
