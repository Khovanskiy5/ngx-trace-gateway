################################################
# GLOBAL ERROR PAGES — тексты страниц ошибок
################################################
# Сами error_page и внутренние location подключаются в каждом server{}
# через snippets/error_pages.conf.
# На уровне http{} error_page не задаётся: он указывал бы на URI, которого
# нет в новых server{}, и вместе с recursive_error_pages зацикливался
# (одна ошибка бэкенда превращалась в 11 запросов к нему и ответ 500).
#
# Переменные ниже подставляются через SSI в error.html и в JSON-ответ.

# Какой документ отдать: JSON (RFC 9457) для API и клиентов, которые просят
# JSON и не просят HTML, иначе HTML-страницу. Решение по исходному запросу
# ($request_uri не меняется при внутренних редиректах), поэтому работает и
# для ошибок, возникших до выбора location (режим обслуживания, 400/494).
# Добавьте сюда префиксы своих API.
map "$request_uri|$http_accept" $error_page_uri {
    "~^/api(?:[/?][^|]*)?\|"                                             /__errors/api;
    "~*^[^|]*\|(?!.*text/html).*application/(?:[a-z0-9.+-]*\+)?json"   /__errors/api;
    default                                                              /__errors/error.html;
}

# Заголовок страницы (HTML).
map $status $error_title {
    400      "Некорректный запрос";
    403      "Доступ запрещён";
    404      "Страница не найдена";
    405      "Метод не поддерживается";
    413      "Слишком большой запрос";
    414      "Слишком длинный адрес";
    429      "Слишком много запросов";
    500      "Внутренняя ошибка сервера";
    502      "Сервис временно недоступен";
    503      "Сервис временно недоступен";
    504      "Сервис не ответил вовремя";
    default  "Ошибка";
}

# Пояснение для пользователя (HTML).
map $status $error_description {
    400      "Сервер не смог разобрать запрос.";
    403      "У вас нет доступа к этому ресурсу.";
    404      "Возможно, страница была удалена или перемещена, или в адресе опечатка.";
    405      "Этот ресурс не поддерживает такой метод запроса.";
    413      "Размер запроса превышает допустимый.";
    414      "Адрес запроса слишком длинный.";
    429      "Вы отправляете запросы слишком часто. Подождите немного и повторите.";
    503      "Идут технические работы или сервис перегружен. Повторите попытку позже.";
    default  "Что-то пошло не так на нашей стороне. Повторите попытку позже.";
}

# Заголовок для JSON (RFC 9457: поле title — стандартная фраза статуса).
map $status $error_title_en {
    400      "Bad Request";
    403      "Forbidden";
    404      "Not Found";
    405      "Method Not Allowed";
    413      "Content Too Large";
    414      "URI Too Long";
    429      "Too Many Requests";
    500      "Internal Server Error";
    502      "Bad Gateway";
    503      "Service Unavailable";
    504      "Gateway Timeout";
    default  "Error";
}

# RFC 9110: ответ 405 обязан содержать Allow. В этом шаблоне 405 формирует
# только модуль статики (всё, кроме GET/HEAD).
map $status $error_allow {
    405      "GET, HEAD";
    default  "";
}
