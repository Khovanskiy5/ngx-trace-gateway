##
# GLOBAL HOP NAME — имя текущего узла (hop) для заголовков, цепочки и логов.
#
# $hop_physical — реальный hostname машины/контейнера/пода.
# $hop_name     — логическое имя роли (edge-gateway, api-nginx-01 …), которое
#                 попадает в X-HOP-Name и в X-Request-Chain.
#
# Самый простой переносимый способ задать имя — hostname контейнера:
# в compose.yaml `hostname: ${HOP_NAME:-edge-gateway}`, в Kubernetes — имя пода.
# Если hostname нельзя поменять, сопоставьте его с ролью в карте ниже.
# Имя должно соответствовать формату элемента цепочки: [A-Za-z0-9._-]{1,64}.
##

# 1) Физическое имя узла — всегда реальный hostname.
map $hostname $hop_physical {
    default $hostname;
}

# 2) Логическое имя hop'а. Ключи — короткие имена, как их возвращает
#    gethostname() (в контейнерах это обычно не FQDN).
map $hostname $hop_name {
    # api-01          api-nginx-01;
    # api-02          api-nginx-02;
    # edge-01         edge-01;

    default           $hostname;
}

# 3) Имя сервиса для поля service.name в JSON-логе.
map $hostname $service_name {
    default "ngx-trace-gateway";
}
