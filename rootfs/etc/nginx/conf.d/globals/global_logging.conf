##
# GLOBAL LOGGING — структурированный JSON access-лог.
#
# Лог пишется в stdout (в контейнере → `docker compose logs`), ошибки — в
# stderr (nginx.conf). Ротацию делает Docker: см. logging в compose.yaml.
# Каждая строка — валидный JSON:
#   - escape=json экранирует кавычки, обратный слеш и управляющие символы;
#   - поля, куда клиент может прислать произвольные байты (URI, User-Agent,
#     Referer, Host, …), проверяются на корректный UTF-8 — иначе строгие
#     парсеры (Elasticsearch/Jackson, Python) отбрасывают всю строку;
#   - числа (статус, время, размеры, счётчики) записаны числами, а значения,
#     которые бывают списком или «-» ($upstream_*), — строками.
# Чувствительные данные в access-лог не попадают: Cookie не пишется вовсе,
# значения query-строки с «секретными» параметрами маскируются, у Referer
# отрезается query-строка. Это касается только access-лога: error_log
# (stderr, тот же поток `docker compose logs`) пишет строку запроса и Referer
# как есть — см. комментарий в nginx.conf.
##

# Сам access_log — в конце файла: он должен стоять после log_format.

# Запись в файлы вместо stdout (например, для внешнего сборщика логов):
# смонтируйте том в /var/log/nginx и замените строку выше на
#   access_log /var/log/nginx/access.log structured_log buffer=64k flush=5s;
# Ротация тогда на вас: logrotate + `docker compose kill -s USR1 gateway`.
#
# Отдельный файл только для ошибок бэкенда — через условие:
#   map $status $log_is_5xx { ~^5 1; default 0; }
#   access_log /var/log/nginx/5xx.log structured_log if=$log_is_5xx;

# ---------------------------------------------------------------------
# Уровень важности события по HTTP-статусу (для алертов и фильтров).
# ---------------------------------------------------------------------
map $status $log_level {
    "~^[123]"  "info";
    "~^4"      "warn";
    "~^5"      "error";
    default    "info";
}

# $status форматируется как «%03d»: в теории возможны «000» и «009», а число
# с ведущим нулём — невалидный JSON. Убираем ведущие нули.
map $status $log_status {
    "~^0+(?<log_status_digits>[0-9]+)$"  $log_status_digits;
    default                             $status;
}

# ---------------------------------------------------------------------
# Время ISO 8601 с миллисекундами: 2026-09-26T13:39:51.747+00:00
# ---------------------------------------------------------------------
# Собирается из $time_iso8601 (секунды и зона) и $msec (миллисекунды).
# Используйте эти переменные только в log_format: значения map кэшируются
# на весь запрос.
map $time_iso8601 $log_iso_datetime {
    "~^(?<log_iso_dt>[0-9-]+T[0-9:]+)"   $log_iso_dt;
    default                             $time_iso8601;
}

map $time_iso8601 $log_iso_timezone {
    "~(?<log_iso_tz>Z|[+-][0-9:]+)$"     $log_iso_tz;
    default                             "";
}

map $msec $log_msec_part {
    "~\.(?<log_msec_digits>[0-9]{3})$"  $log_msec_digits;
    default                             "000";
}

# ---------------------------------------------------------------------
# Маскирование чувствительных данных
# ---------------------------------------------------------------------
# Query-строка берётся из $request_uri: он не меняется при внутренних
# редиректах (например, на страницу ошибки), в отличие от $args.
map $request_uri $log_query_raw {
    "~\?(?<log_query_part>.*)$"         $log_query_part;
    default                             "";
}

# Если в query-строке есть параметр, похожий на секрет (OAuth code, токены,
# пароли, ключи, подписи), вместо всей строки пишем «[REDACTED]».
map $log_query_raw $log_args_redacted {
    default  $log_query_raw;
    "~*(?:^|&)(?:access_token|id_token|refresh_token|token|code|state|password|passwd|pwd|secret|client_secret|api_key|apikey|key|signature|sig|auth|session|sessionid|jwt)="
             "[REDACTED]";
}

# uri_raw — путь «как пришёл» (в percent-encoding), но без query-строки:
# query пишется отдельно, в поле args (с маскированием).
map $request_uri $log_uri_raw_unchecked {
    "~^(?<log_request_path>[^?]*)"      $log_request_path;
    default                             "";
}

# Referer — без query-строки: там часто оказываются токены и коды.
map $http_referer $log_referer_unchecked {
    "~^(?<log_referer_base>[^?]*)\?"    "$log_referer_base?[REDACTED]";
    default                             $http_referer;
}

# ---------------------------------------------------------------------
# Проверка корректности UTF-8 для полей, которые контролирует клиент
# ---------------------------------------------------------------------
# Регулярное выражение описывает только корректные последовательности UTF-8
# (RFC 3629). Некорректное значение заменяется на «[invalid-utf8]».
# Внешнее повторение «*+» — possessive: без возврата PCRE2 JIT держал бы кадр
# стека на каждый символ и на значениях длиннее ~1,3 КБ падал бы с ошибкой
# (строка ушла бы в лог как «[invalid-utf8]» плюс [alert] на каждый запрос).
# Пустое значение проверяется отдельной строкой "" "": регулярное выражение
# на пустой (или не заданной) переменной в map не срабатывает.
# Путь для поля uri. Если внутренний редирект на страницу ошибки случился
# раньше, чем путь был зафиксирован (ошибки разбора запроса 400/494, которые
# возникают до фазы rewrite), берём исходный путь из $request_uri.
map $uri $log_uri_source {
    "~^/__errors/"                      $log_uri_raw_unchecked;
    default                             $uri;
}

map $log_uri_source $log_uri {
    ""       "";
    "~^(?:[\x01-\x7F]|[\xC2-\xDF][\x80-\xBF]|\xE0[\xA0-\xBF][\x80-\xBF]|[\xE1-\xEC\xEE\xEF][\x80-\xBF]{2}|\xED[\x80-\x9F][\x80-\xBF]|\xF0[\x90-\xBF][\x80-\xBF]{2}|[\xF1-\xF3][\x80-\xBF]{3}|\xF4[\x80-\x8F][\x80-\xBF]{2})*+$"
             $log_uri_source;
    default  "[invalid-utf8]";
}

map $log_uri_raw_unchecked $log_uri_raw {
    ""       "";
    "~^(?:[\x01-\x7F]|[\xC2-\xDF][\x80-\xBF]|\xE0[\xA0-\xBF][\x80-\xBF]|[\xE1-\xEC\xEE\xEF][\x80-\xBF]{2}|\xED[\x80-\x9F][\x80-\xBF]|\xF0[\x90-\xBF][\x80-\xBF]{2}|[\xF1-\xF3][\x80-\xBF]{3}|\xF4[\x80-\x8F][\x80-\xBF]{2})*+$"
             $log_uri_raw_unchecked;
    default  "[invalid-utf8]";
}

map $log_args_redacted $log_args {
    ""       "";
    "~^(?:[\x01-\x7F]|[\xC2-\xDF][\x80-\xBF]|\xE0[\xA0-\xBF][\x80-\xBF]|[\xE1-\xEC\xEE\xEF][\x80-\xBF]{2}|\xED[\x80-\x9F][\x80-\xBF]|\xF0[\x90-\xBF][\x80-\xBF]{2}|[\xF1-\xF3][\x80-\xBF]{3}|\xF4[\x80-\x8F][\x80-\xBF]{2})*+$"
             $log_args_redacted;
    default  "[invalid-utf8]";
}

map $http_user_agent $log_user_agent {
    ""       "";
    "~^(?:[\x01-\x7F]|[\xC2-\xDF][\x80-\xBF]|\xE0[\xA0-\xBF][\x80-\xBF]|[\xE1-\xEC\xEE\xEF][\x80-\xBF]{2}|\xED[\x80-\x9F][\x80-\xBF]|\xF0[\x90-\xBF][\x80-\xBF]{2}|[\xF1-\xF3][\x80-\xBF]{3}|\xF4[\x80-\x8F][\x80-\xBF]{2})*+$"
             $http_user_agent;
    default  "[invalid-utf8]";
}

map $log_referer_unchecked $log_referer {
    ""       "";
    "~^(?:[\x01-\x7F]|[\xC2-\xDF][\x80-\xBF]|\xE0[\xA0-\xBF][\x80-\xBF]|[\xE1-\xEC\xEE\xEF][\x80-\xBF]{2}|\xED[\x80-\x9F][\x80-\xBF]|\xF0[\x90-\xBF][\x80-\xBF]{2}|[\xF1-\xF3][\x80-\xBF]{3}|\xF4[\x80-\x8F][\x80-\xBF]{2})*+$"
             $log_referer_unchecked;
    default  "[invalid-utf8]";
}

map $remote_user $log_remote_user {
    ""       "";
    "~^(?:[\x01-\x7F]|[\xC2-\xDF][\x80-\xBF]|\xE0[\xA0-\xBF][\x80-\xBF]|[\xE1-\xEC\xEE\xEF][\x80-\xBF]{2}|\xED[\x80-\x9F][\x80-\xBF]|\xF0[\x90-\xBF][\x80-\xBF]{2}|[\xF1-\xF3][\x80-\xBF]{3}|\xF4[\x80-\x8F][\x80-\xBF]{2})*+$"
             $remote_user;
    default  "[invalid-utf8]";
}

# Для полей, где допустим только печатный ASCII, достаточно простой проверки.
map $http_host $log_host_header {
    ""       "";
    "~^[\x20-\x7E]*+$"  $http_host;
    default            "[invalid]";
}

map $host $log_host {
    ""       "";
    "~^[\x20-\x7E]*+$"  $host;
    default            "[invalid]";
}

map $http_x_forwarded_for $log_forwarded_for {
    ""       "";
    "~^[\x20-\x7E]*+$"  $http_x_forwarded_for;
    default            "[invalid]";
}

map $content_type $log_content_type {
    ""       "";
    "~^[\x20-\x7E]*+$"  $content_type;
    default            "[invalid]";
}

map $ssl_server_name $log_ssl_server_name {
    ""       "";
    "~^[\x20-\x7E]*+$"  $ssl_server_name;
    default            "[invalid]";
}

# ---------------------------------------------------------------------
# Исходный запрос для лога
# ---------------------------------------------------------------------
# При ошибке nginx делает внутренний редирект на /__errors/…, и $uri/$args
# меняются. snippets/error_pages.conf вычисляет эту переменную заранее (в
# фазе rewrite сервера): значения map кэшируются на весь запрос, поэтому в
# логе остаются исходные путь и query-строка.
map "$log_uri|$log_args" $log_request_snapshot {
    default "1";
}

# ---------------------------------------------------------------------
# Формат structured_log
# ---------------------------------------------------------------------
log_format structured_log escape=json
    '{'
        # Время обработки запроса: ISO 8601 с миллисекундами и то же время
        # числом (секунды с миллисекундами от начала эпохи) — для сортировки
        # и корреляции без разбора строки.
        '"timestamp":"$log_iso_datetime.$log_msec_part$log_iso_timezone",'
        '"timestamp_msec":$msec,'

        # Уровень события по статусу: 1xx–3xx → info, 4xx → warn, 5xx → error.
        '"severity":"$log_level",'

        # Логическое имя сервиса (global_hop_name.conf). Имя узла — в trace.hop_physical.
        '"service":{'
            '"name":"$service_name"'
        '},'

        # trace: всё для корреляции запросов между системами (global_trace.conf).
        '"trace":{'
            # Логическое имя этого hop'а (роль узла): edge-gateway, api-nginx …
            '"hop_name":"$hop_name",'
            # Реальный hostname машины/контейнера/пода.
            '"hop_physical":"$hop_physical",'
            # ID предыдущего hop'а — из входящего X-Prev-Request-ID (или пусто).
            '"prev_request_id":"$prev_request_id",'
            # ID запроса на этом узле ($request_id). Вниз по цепочке уходит
            # в X-Prev-Request-ID.
            '"local_request_id":"$local_request_id",'
            # Сквозной ID запроса (X-Request-ID) — по нему ищут запрос во всех системах.
            '"trace_request_id":"$trace_request_id",'
            # Откуда взят trace ID: header (X-Request-ID), traceparent или generated.
            '"trace_id_source":"$trace_id_source",'
            # Цепочка hop'ов «hop:id, hop:id, …» с текущим узлом в конце.
            '"hops_chain":"$request_hops_chain",'
            # Мобильные идентификаторы: запуск приложения и конкретный запрос.
            '"mobile_launch_id":"$mobile_launch_id",'
            '"mobile_request_id":"$mobile_request_id",'
            # Поля W3C traceparent (если пришёл корректный заголовок версии 00):
            # позволяют связать строку лога с трассой в APM (Jaeger, Tempo …).
            '"traceparent":{'
                '"trace_id":"$traceparent_trace_id",'
                '"parent_id":"$traceparent_parent_id"'
            '}'
        '},'

        # client: кто пришёл.
        '"client":{'
            # Адрес клиента. Если настроен realip (global_real_ip.conf) —
            # восстановленный адрес клиента из X-Forwarded-For.
            '"ip":"$remote_addr",'
            '"port":"$remote_port",'
            # Пользователь HTTP Basic-аутентификации (обычно пусто).
            '"user":"$log_remote_user",'
            # Входящий X-Forwarded-For как есть (управляется клиентом!).
            '"forwarded_for":"$log_forwarded_for",'
            # Адрес непосредственного TCP-собеседника (например, балансировщика).
            # Без realip совпадает с client.ip.
            '"peer_ip":"$realip_remote_addr"'
        '},'

        # network: сетевой контекст на стороне сервера.
        '"network":{'
            '"server_ip":"$server_addr",'
            '"server_port":$server_port,'
            # Версия протокола: HTTP/1.1, HTTP/2.0, HTTP/3.0.
            '"protocol":"$server_protocol",'
            '"connection":{'
                # Номер соединения и сколько запросов по нему уже обработано (keepalive).
                '"id":$connection,'
                '"requests":$connection_requests,'
                # Сколько секунд соединение открыто.
                '"time":$connection_time'
            '},'
            # Метрики TCP из ядра (только Linux; на других ОС — пусто).
            '"tcp":{'
                '"rtt":"$tcpinfo_rtt",'
                '"rttvar":"$tcpinfo_rttvar",'
                '"snd_cwnd":"$tcpinfo_snd_cwnd"'
            '}'
        '},'

        # tls: параметры TLS (для запросов по HTTP — пустые строки).
        '"tls":{'
            '"enabled":"$https",'
            '"protocol":"$ssl_protocol",'
            '"cipher":"$ssl_cipher",'
            # Группа обмена ключами: X25519MLKEM768 — постквантовый гибрид.
            '"curve":"$ssl_curve",'
            '"session_reused":"$ssl_session_reused",'
            '"sni":"$log_ssl_server_name"'
        '},'

        # Геоданные можно добавить при наличии модуля GeoIP2, например:
        # '"geo":{"country":"$geoip2_country_code"},'

        '"http":{'
            # request: входящий запрос.
            '"request":{'
                '"method":"$request_method",'
                # Нормализованный и декодированный путь (после rewrite).
                '"uri":"$log_uri",'
                # Путь как пришёл от клиента (percent-encoding), без query-строки.
                '"uri_raw":"$log_uri_raw",'
                # Query-строка; с «секретными» параметрами — [REDACTED].
                '"args":"$log_args",'
                '"scheme":"$scheme",'
                # Имя хоста после выбора server{} и заголовок Host как прислал клиент.
                '"host":"$log_host",'
                '"host_header":"$log_host_header",'
                '"headers":{'
                    # Referer без query-строки.
                    '"referer":"$log_referer",'
                    '"user_agent":"$log_user_agent"'
                '},'
                # Размер всего запроса: строка запроса, заголовки и тело.
                '"size_bytes":$request_length,'
                '"content_length":"$content_length",'
                '"content_type":"$log_content_type",'
                # 1 — query-строка похожа на SQLi/XSS (только пометка, не блокировка;
                # см. global_security.conf).
                '"suspicious":$request_suspicious'
            '},'

            # response: ответ клиенту.
            '"response":{'
                '"status":$log_status,'
                # Время обработки от первого байта запроса до последнего байта ответа, с.
                '"time_sec":$request_time,'
                '"bytes_sent":$bytes_sent,'
                '"body_bytes_sent":$body_bytes_sent,'
                '"gzip_ratio":"$gzip_ratio",'
                '"headers":{'
                    '"content_type":"$sent_http_content_type",'
                    '"content_length":"$sent_http_content_length",'
                    # Connection, отправленный клиенту: keep-alive, close или upgrade.
                    '"connection":"$sent_http_connection"'
                '}'
            '},'

            # server: какой server{} обработал запрос.
            '"server":{'
                '"name":"$server_name"'
            '},'

            # upstream: проксирование. При повторных попытках значения — списки
            # через «, », при внутренних редиректах — через « : », поэтому строки.
            '"upstream":{'
                '"address":"$upstream_addr",'
                '"status":"$upstream_status",'
                # HIT, MISS, BYPASS, EXPIRED, STALE, UPDATING, REVALIDATED.
                '"cache_status":"$upstream_cache_status",'
                '"bytes_sent":"$upstream_bytes_sent",'
                '"bytes_received":"$upstream_bytes_received",'
                '"response_length":"$upstream_response_length",'
                '"timings":{'
                    # Установка соединения, получение заголовков (TTFB бэкенда),
                    # полный ответ — в секундах.
                    '"connect":"$upstream_connect_time",'
                    '"header":"$upstream_header_time",'
                    '"response":"$upstream_response_time"'
                '},'
                '"headers":{'
                    '"server":"$upstream_http_server",'
                    '"content_type":"$upstream_http_content_type"'
                '}'
            '}'
        '},'

        # «p», если запрос пришёл в HTTP pipelining, иначе «.».
        '"pipe":"$pipe"'
    '}';

# Access-лог по умолчанию для всех server{} (наследуется, пока в server{}
# или location{} не задан свой access_log).
access_log /dev/stdout structured_log;
