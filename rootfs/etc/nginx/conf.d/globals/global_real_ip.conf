##
# GLOBAL REAL IP — реальный IP клиента и заголовки X-Forwarded-* за балансировщиком.
#
# По умолчанию шлюз считается ПЕРВЫМ узлом (edge): доверенных прокси нет,
# клиентские X-Forwarded-For / X-Forwarded-Proto игнорируются, а бэкенду
# передаётся только реальный адрес TCP-соединения. Иначе любой клиент мог бы
# подставить чужой IP и обойти лимиты, ACL и геоправила.
#
# Если перед nginx стоит свой балансировщик/CDN, перечислите ТОЛЬКО его
# адреса — одновременно в set_real_ip_from и в geo ниже. Никогда не пишите
# 0.0.0.0/0: тогда подделать адрес сможет кто угодно.
##

# 1) Модуль realip: $remote_addr станет адресом клиента из X-Forwarded-For,
#    а $realip_remote_addr сохранит адрес самого балансировщика.
# set_real_ip_from  10.0.0.0/8;          # адреса вашего LB/CDN
# set_real_ip_from  192.168.0.0/16;
# real_ip_header    X-Forwarded-For;     # или proxy_protocol, если LB шлёт PROXY protocol
# real_ip_recursive on;                  # пропускать все доверенные адреса справа налево

# 2) Тот же список — для решения, доверять ли входящим X-Forwarded-*.
geo $realip_remote_addr $trusted_proxy {
    default 0;
    # 10.0.0.0/8      1;
    # 192.168.0.0/16  1;
}

# X-Forwarded-For для бэкенда.
# - edge (запрос не от доверенного прокси): клиентский XFF отбрасываем, передаём
#   только $remote_addr;
# - за доверенным прокси: сохраняем пришедшую цепочку и дописываем адрес прокси.
#   ($proxy_add_x_forwarded_for здесь не подходит: при включённом realip он
#   дописал бы восстановленный адрес клиента второй раз.)
map "$trusted_proxy:$http_x_forwarded_for" $proxy_x_forwarded_for {
    default                    $remote_addr;
    "1:"                       $realip_remote_addr;
    "~^1:(?<xff_chain>.+)$"    "$xff_chain, $realip_remote_addr";
}

# X-Forwarded-Proto: за доверенным прокси, снявшим TLS, берём его значение,
# иначе — собственную схему соединения.
map "$trusted_proxy:$http_x_forwarded_proto" $proxy_x_forwarded_proto {
    default                     $scheme;
    "~^1:(?<xfp_value>https?)$" $xfp_value;
}
