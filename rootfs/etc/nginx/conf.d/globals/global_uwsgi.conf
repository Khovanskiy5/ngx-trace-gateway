##
# GLOBAL UWSGI — значения по умолчанию для uwsgi_pass (Django, Flask …).
#
# Параметры задаются в location: `include uwsgi_params;` +
# snippets/uwsgi_trace_params.conf. uwsgi_modifier1 глобально не задаём:
# это настройка конкретного плагина uWSGI, а не общий параметр.
##
uwsgi_connect_timeout 5s;
uwsgi_send_timeout    60s;
uwsgi_read_timeout    60s;

uwsgi_buffering         on;
uwsgi_buffer_size       16k;
uwsgi_buffers           16 16k;
uwsgi_busy_buffers_size 32k;

uwsgi_next_upstream       error timeout;
uwsgi_next_upstream_tries 2;
uwsgi_next_upstream_timeout 30s;   # не дольше 30 с на все попытки

uwsgi_temp_path /var/cache/nginx/uwsgi_temp;

# Скрытие заголовков ответа приложения (X-Powered-By и копии заголовков
# трассировки) — в snippets/uwsgi_hide_headers.conf. uwsgi_hide_header
# наследуется по правилу «всё или ничего»: если в location нужен свой
# uwsgi_hide_header, подключите туда этот snippet повторно.
include /etc/nginx/snippets/uwsgi_hide_headers.conf;

# Кэш uWSGI — по аналогии с global_fastcgi.conf (uwsgi_cache_path + uwsgi_cache).
