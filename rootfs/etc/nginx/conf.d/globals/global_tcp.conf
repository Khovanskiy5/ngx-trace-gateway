##
# GLOBAL TCP — ввод-вывод, keepalive, таймауты и лимиты клиентских запросов.
##

# sendfile(): ядро отдаёт файл в сокет напрямую, минуя user-space.
# Эффективно для статики (CSS/JS/картинки).
sendfile        on;

# Вместе с sendfile: отправлять заголовки и начало файла одним пакетом.
tcp_nopush      on;

# Для keepalive-соединений отключает алгоритм Nagle: маленькие ответы
# (например, короткий JSON) уходят сразу, без ожидания.
tcp_nodelay     on;

# -------------------------------------------------------------------
#  Keepalive с клиентами
# -------------------------------------------------------------------
# Сколько держать простаивающее клиентское соединение.
keepalive_timeout  65s;

# keepalive_time (по умолчанию 1h) и keepalive_requests (по умолчанию 1000)
# оставлены значениями по умолчанию.

# -------------------------------------------------------------------
#  Таймауты клиента (защита от slowloris и «висящих» соединений)
# -------------------------------------------------------------------
client_header_timeout 15s;   # на получение заголовков запроса
client_body_timeout   30s;   # между двумя последовательными чтениями тела
send_timeout          30s;   # между двумя последовательными записями ответа

# Закрывать соединения по таймауту сразу (RST), не держа память в FIN_WAIT.
reset_timedout_connection on;

# -------------------------------------------------------------------
#  Размеры запросов
# -------------------------------------------------------------------
# Максимальный размер тела запроса (по умолчанию 1m — мало для API-шлюза).
# Для загрузки файлов увеличивайте точечно в нужном location.
client_max_body_size    16m;

# Тела до этого размера держатся в памяти, больше — во временном файле.
client_body_buffer_size 128k;

# Буферы для длинных заголовков: JWT, большие cookie, X-Request-Chain
# (до ~3,3 КБ после ограничения в global_trace.conf).
large_client_header_buffers 4 16k;

# -------------------------------------------------------------------
#  Хеш-таблицы
# -------------------------------------------------------------------
types_hash_max_size       4096;   # таблица расширение → MIME-тип
variables_hash_max_size   2048;   # в шаблоне много переменных (map)
variables_hash_bucket_size 128;
