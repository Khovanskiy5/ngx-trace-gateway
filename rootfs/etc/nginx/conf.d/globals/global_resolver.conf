##
# GLOBAL RESOLVER — DNS для имён, которые nginx резолвит во время работы:
#   - upstream с `server имя resolve` (sites-available/*/upstream.conf);
#   - proxy_pass с переменной (proxy_pass http://$backend;);
#   - OCSP stapling (snippets/ocsp_stapling.conf).
# Имена в обычном `server имя:порт` и `proxy_pass http://имя` резолвятся
# один раз при старте через /etc/resolv.conf и в этой настройке не нуждаются.
#
# 127.0.0.11 — встроенный DNS Docker (он знает имена сервисов compose).
# В Kubernetes укажите адрес kube-dns (ClusterIP сервиса kube-system/kube-dns),
# без Docker — внутренний DNS сервера. Публичные резолверы (1.1.1.1, 8.8.8.8)
# не используйте: они не знают внутренних имён, а запросы к ним раскрывают
# эти имена внешнему сервису.
##
resolver         127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
