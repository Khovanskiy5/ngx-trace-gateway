##
# GLOBAL CACHE — зона proxy_cache и кэш файловых дескрипторов.
#
# Сама зона ничего не кэширует: кэш включается точечно в location через
# snippets/proxy_cache.conf. Безопасное поведение кэша — в global_proxy.conf.
##

# Зона appcache:
#   /var/cache/nginx/gate — каталог на диске (именованный том в compose.yaml);
#   levels=1:2            — два уровня подкаталогов, чтобы не держать
#                           десятки тысяч файлов в одном каталоге;
#   keys_zone=appcache:32m — индекс в общей памяти: ~8000 ключей на 1 МБ,
#                           то есть около 250 000 объектов;
#   inactive=60m          — удалять объекты без обращений дольше часа;
#   max_size=1g           — предел размера на диске;
#   use_temp_path=off     — писать сразу в каталог кэша, без лишнего копирования.
proxy_cache_path /var/cache/nginx/gate levels=1:2 keys_zone=appcache:32m inactive=60m max_size=1g use_temp_path=off;

# Не брать ответ из кэша и не сохранять в кэш, если в запросе есть
# Authorization или любые Cookie: такие ответы обычно персональные.
# Если кэшировать нужно и при аналитических cookie, сузьте условие до
# cookie сессии, например "$http_authorization$cookie_sessionid".
map "$http_authorization$http_cookie" $cache_bypass {
    ""       0;
    default  1;
}

# Кэш дескрипторов и метаданных файлов (stat/open) для статики.
# Ошибки «файл не найден» не кэшируем: иначе только что выложенный файл
# ещё до 30 секунд отдавал бы 404.
open_file_cache          max=10000 inactive=30s;
open_file_cache_valid    30s;
open_file_cache_min_uses 2;
open_file_cache_errors   off;
