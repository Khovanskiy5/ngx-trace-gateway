##
# GLOBAL PROXY — значения по умолчанию для proxy_pass во всех server{}.
#
# Скалярные директивы (таймауты, буферы) можно переопределять в location
# по одной — остальные унаследуются. Заголовки (proxy_set_header,
# proxy_hide_header) лежат в snippets/proxy_headers.conf и наследуются по
# правилу «всё или ничего» (см. http.conf).
##

# HTTP/1.1 к upstream: нужен для keepalive и WebSocket. В nginx ≥ 1.29.7 это
# уже значение по умолчанию, но OpenResty 1.29 и старые версии шлют HTTP/1.0.
proxy_http_version 1.1;

# -------------------------------------------------------------------
#  Таймауты
# -------------------------------------------------------------------
proxy_connect_timeout 5s;    # установка TCP-соединения
proxy_send_timeout    60s;   # между двумя записями запроса
proxy_read_timeout    60s;   # между двумя чтениями ответа (значение nginx по умолчанию)
# Для WebSocket/SSE и медленных отчётов увеличивайте в location:
# snippets/websocket.conf, snippets/sse.conf.

# -------------------------------------------------------------------
#  Повторы на другом сервере группы
# -------------------------------------------------------------------
# Только при ошибке соединения и таймауте. Неидемпотентные запросы (POST,
# PATCH …) nginx по умолчанию не повторяет. Ошибки и таймауты считаются в
# max_fails сервера (upstream.conf).
proxy_next_upstream         error timeout;
proxy_next_upstream_tries   2;     # не больше двух попыток на запрос
proxy_next_upstream_timeout 30s;   # и не дольше 30 секунд на все попытки

# -------------------------------------------------------------------
#  Буферизация ответов
# -------------------------------------------------------------------
# Разгружает бэкенд: nginx быстро забирает ответ и сам отдаёт его медленному
# клиенту. Глобально не выключаем; для стриминга — snippets/sse.conf.
proxy_buffering         on;
proxy_buffer_size       16k;   # заголовки ответа (длинные Set-Cookie, JWT)
proxy_buffers           16 16k;
proxy_busy_buffers_size 32k;

proxy_temp_path /var/cache/nginx/proxy_temp;

# -------------------------------------------------------------------
#  TLS к upstream (proxy_pass https://…)
# -------------------------------------------------------------------
# По умолчанию nginx не проверяет сертификат бэкенда и не шлёт SNI — это
# открывает MITM между шлюзом и бэкендом. Для proxy_pass на группу
# upstream имя для SNI и проверки по умолчанию — имя группы, поэтому в
# location укажите настоящее: proxy_ssl_name api.example.com;
# Для внутреннего CA — свой proxy_ssl_trusted_certificate.
proxy_ssl_server_name         on;
proxy_ssl_verify              on;
proxy_ssl_verify_depth        3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_protocols           TLSv1.2 TLSv1.3;
proxy_ssl_session_reuse       on;

# -------------------------------------------------------------------
#  Кэш (действует только там, где включён proxy_cache — snippets/proxy_cache.conf)
# -------------------------------------------------------------------
# Ключ без Authorization: иначе токены попадали бы в файлы кэша открытым текстом.
proxy_cache_key "$scheme|$request_method|$host|$request_uri";

# Персональные запросы (Authorization/Cookie) — мимо кэша (global_cache.conf).
proxy_cache_bypass $cache_bypass;
proxy_no_cache     $cache_bypass;

# Заголовки кэширования бэкенда (Cache-Control, Expires, Set-Cookie, Vary)
# НЕ игнорируем: private/no-store и ответы с Set-Cookie не кэшируются.

# Пока один запрос обновляет объект, остальные ждут его (не больше 5 с),
# а не идут толпой в бэкенд.
proxy_cache_lock         on;
proxy_cache_lock_timeout 5s;

# Устаревший ответ лучше ошибки: при сбое бэкенда и во время обновления.
# (Без «updating» фоновое обновление ниже не работает.) 403/404 сюда не
# входят: удалённый ресурс или отозванный доступ не должны «воскресать».
proxy_cache_use_stale         error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;

# Обновлять объект условным запросом (If-Modified-Since / If-None-Match).
proxy_cache_revalidate on;

# -------------------------------------------------------------------
#  Заголовки запроса к бэкенду и скрытие заголовков ответа бэкенда
# -------------------------------------------------------------------
include /etc/nginx/snippets/proxy_headers.conf;
