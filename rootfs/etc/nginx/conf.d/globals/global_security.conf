##
# GLOBAL SECURITY — базовая безопасность для всех server{}.
##

# Не раскрывать версию в заголовке Server и на страницах ошибок.
server_tokens off;

# -------------------------------------------------------------------
#  Заголовки ответа (безопасность + трассировка)
# -------------------------------------------------------------------
# Сами add_header лежат в snippets/, чтобы их можно было подключить повторно
# там, где появляется свой add_header (правило «всё или ничего», см. http.conf).
include /etc/nginx/snippets/response_headers.conf;

# Значения заголовков безопасности. Если бэкенд уже прислал такой заголовок,
# шлюз свой не добавляет: остаётся выбор приложения (например, более строгий
# X-Frame-Options: DENY или своя Permissions-Policy) и не появляется дублей.
# Для ответов, которые nginx формирует сам, $upstream_http_* пусты — тогда
# подставляются значения по умолчанию.
map $upstream_http_x_content_type_options $security_x_content_type_options {
    ""       "nosniff";
    default  "";
}

# Встраивание в iframe — только со своего origin. Для полного запрета
# используйте DENY или CSP frame-ancestors 'none' (snippets/headers_html_strict.conf).
map $upstream_http_x_frame_options $security_x_frame_options {
    ""       "SAMEORIGIN";
    default  "";
}

# Referrer-Policy. Источники OWASP расходятся: HTTP Headers Cheat Sheet
# рекомендует strict-origin-when-cross-origin (это и значение браузеров по
# умолчанию), OWASP Secure Headers Project — no-referrer. По умолчанию берём
# первое: no-referrer ломает CSRF-проверки по Origin/Referer (браузер шлёт
# «Origin: null» в POST-формах — Django, Rails) и аналитику. Строгий профиль
# snippets/headers_html_strict.conf включает no-referrer через
# `set $referrer_policy_profile strict;`.
map $server_port $referrer_policy_profile {
    default  "";
}

map "$referrer_policy_profile|$upstream_http_referrer_policy" $security_referrer_policy {
    "|"        "strict-origin-when-cross-origin";
    "strict|"  "no-referrer";
    default    "";
}

map $upstream_http_permissions_policy $security_permissions_policy {
    ""       "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
    default  "";
}

map $upstream_http_x_permitted_cross_domain_policies $security_x_permitted_cross_domain_policies {
    ""       "none";
    default  "";
}

# X-XSS-Protection устарел: встроенный XSS-фильтр старых браузеров сам создавал
# уязвимости. OWASP рекомендует явно выключать его значением 0.
map $upstream_http_x_xss_protection $security_x_xss_protection {
    ""       "0";
    default  "";
}

# HSTS — только для ответов, которые клиент получил по HTTPS: по схеме
# соединения или по X-Forwarded-Proto от доверенного балансировщика
# ($proxy_x_forwarded_proto, global_real_ip.conf). Заголовок входит в общий
# набор (snippets/security_headers.conf), поэтому есть и на API, и на
# страницах ошибок, и на редиректах. Два года и includeSubDomains —
# рекомендация TLSRef (бывший Mozilla SSL Config) 6.0. preload добавляйте
# осознанно: исключение из preload-списка браузеров занимает месяцы.
map "$proxy_x_forwarded_proto|$upstream_http_strict_transport_security" $security_strict_transport_security {
    "https|"  "max-age=63072000; includeSubDomains";
    default   "";
}

# Alt-Svc для HTTP/3: snippets/http3.conf выставляет `set $alt_svc …;`
# в своём server{}. В остальных серверах значение пустое и заголовок не
# отправляется.
map $server_port $alt_svc {
    default  "";
}

# Retry-After для ответов 429 и 503, если бэкенд не прислал свой.
map "$status:$upstream_http_retry_after" $security_retry_after {
    "429:"   "1";
    "503:"   "120";
    default  "";
}

# -------------------------------------------------------------------
#  Каноничные URL (только для страниц сайта)
# -------------------------------------------------------------------
# Вычисляет цель 301-редиректа; применяется в server{} через
# snippets/canonical_redirects.conf. Правила:
#   /path/index.html, /path/index.php → /path/   (query сохраняется)
#   /path?                            → /path     (пустой «?»)
#   /a//b                             → /a/b      (повторные слеши, по одному за шаг)
# Цель строится только из «сырого» $request_uri: он остаётся в
# percent-encoding, поэтому %0d%0a не превращается в перевод строки
# (с $uri здесь была бы HTTP response splitting). Location получается
# относительным (absolute_redirect off), поэтому порт и схема сохраняются.
# Не трогаем: методы кроме GET/HEAD (редирект превратил бы POST в GET),
# /api/, /.well-known/ (ACME) и пути, начинающиеся с «//» или «/\» —
# из них получился бы протокол-относительный Location на чужой домен.
# Добавлять завершающий слеш не нужно: для реальных каталогов nginx делает
# этот редирект сам.
map "$request_method:$request_uri" $canonical_redirect {
    default                                                           "";
    "~^(?!GET:|HEAD:)"                                                "";
    "~^[A-Z]+:/(?:api|\.well-known)(?:[/?]|$)"                        "";
    "~^[A-Z]+:/[/\x5c]"                                               "";
    "~^[A-Z]+:(?<canon_dir>[^?]*/)index\.(?:html?|php)(?<canon_query>\?.*)?$"   "$canon_dir$canon_query";
    "~^[A-Z]+:(?<canon_path>[^?]*)\?$"                                $canon_path;
    "~^[A-Z]+:(?<canon_head>[^?]*?)//+(?<canon_rest>[^?]*)(?<canon_args>\?.*)?$" "$canon_head/$canon_rest$canon_args";
}

# -------------------------------------------------------------------
#  Подозрительные запросы — только пометка в логе
# -------------------------------------------------------------------
# Простые шаблоны SQLi/XSS не заменяют WAF: у них много ложных срабатываний
# и тривиальные обходы. Поэтому по умолчанию они ничего не блокируют, а лишь
# ставят "suspicious":1 в JSON-логе — сначала измерьте, потом решайте.
# Заблокировать можно точечно в выбранном location:
#     if ($request_suspicious) { return 403; }
# Для реальной защиты используйте ModSecurity v3 + OWASP CRS или WAF на Lua.
map $args $request_suspicious {
    default                                         0;
    "~*(?:<|%3C)\s*/?\s*script\b"                   1;
    "~*\bunion\b.{0,100}\bselect\b"                 1;
    "~*(?:GLOBALS|_REQUEST)(?:=|\[|%5B)"            1;
}

# Cache-Control для ответов API (snippets/api_headers.conf): no-store,
# если бэкенд не задал кэширование сам.
map $upstream_http_cache_control $api_cache_control {
    ""       "no-store";
    default  "";
}
