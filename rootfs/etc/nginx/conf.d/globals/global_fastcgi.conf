##
# GLOBAL FASTCGI — значения по умолчанию для fastcgi_pass (например, php-fpm).
#
# Здесь только скалярные директивы. Параметры (fastcgi_param) задаются в
# location: `include fastcgi_params;` + snippets/fastcgi_trace_params.conf,
# или всё сразу — snippets/fastcgi_php.conf. На уровне http{} параметров нет
# намеренно: первый же fastcgi_param в location отменил бы их все.
#
# Set-Cookie от приложения НЕ скрывается (раньше fastcgi_hide_header
# Set-Cookie на уровне http ломал сессии и логин во всех PHP-приложениях).
##
fastcgi_connect_timeout 5s;
fastcgi_send_timeout    60s;
fastcgi_read_timeout    60s;

fastcgi_buffering         on;
fastcgi_buffer_size       16k;
fastcgi_buffers           16 16k;
fastcgi_busy_buffers_size 32k;

fastcgi_next_upstream       error timeout;
fastcgi_next_upstream_tries 2;
fastcgi_next_upstream_timeout 30s;   # не дольше 30 с на все попытки

fastcgi_temp_path /var/cache/nginx/fastcgi_temp;

# Скрываем технологический стек приложения.
# Скрытие заголовков ответа приложения (X-Powered-By и копии заголовков
# трассировки) — в snippets/fastcgi_hide_headers.conf. fastcgi_hide_header
# наследуется по правилу «всё или ничего»: если в location нужен свой
# fastcgi_hide_header, подключите туда этот snippet повторно.
include /etc/nginx/snippets/fastcgi_hide_headers.conf;

# Кэш FastCGI по умолчанию не настроен. Чтобы включить, нужна своя зона
# (зона proxy_cache для fastcgi_cache не подходит):
#   fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=fcgicache:16m inactive=60m max_size=512m;
#   fastcgi_cache_key  "$scheme|$request_method|$host|$request_uri";
#   fastcgi_cache_bypass $cache_bypass;  fastcgi_no_cache $cache_bypass;
# и в location: fastcgi_cache fcgicache; fastcgi_cache_valid 200 10m;
