##
# GLOBAL RATE LIMIT — зоны limit_req/limit_conn и общие параметры.
#
# Зоны создаются здесь (только в http{}), а ограничение включается в
# server{}/location{} директивами limit_req/limit_conn — пример в
# sites-available/default/app_locations.conf (location /api/).
#
# Принципы:
#   1) Ключ зоны — по чему считаем запросы. $binary_remote_addr — по IP
#      (компактно). Ключ из заголовка (X-Api-Key, X-Consumer-Id) — только
#      подсказка: клиент может менять его на каждом запросе, поэтому такую
#      зону ВСЕГДА сочетайте с зоной по IP. Настоящий лимит по пользователю
#      требует проверенной личности (JWT в njs/Lua, auth_request).
#   2) Память: ~64–128 байт на ключ; 10m — это десятки тысяч ключей.
#   3) rate — средняя скорость; поведение при всплесках задают burst,
#      delay/nodelay в limit_req.
#   4) Пустой ключ не учитывается: анонимные клиенты не делят одну
#      общую «корзину» (что позволило бы одному клиенту заблокировать всех),
#      их ограничивает зона по IP.
#   5) limit_req работает в фазе preaccess: ответы из фазы rewrite
#      (return в server{} или в if) не ограничиваются.
##

# Код ответа при превышении — 429 Too Many Requests (по умолчанию 503,
# и клиенты с мониторингом путали бы ограничение с аварией).
limit_req_status    429;
limit_conn_status   429;
limit_req_log_level warn;

################################################################################
## Ключи из заголовков: только корректные и ограниченные по длине значения
################################################################################

# Идентификатор потребителя API (X-Consumer-Id).
map $http_x_consumer_id $api_consumer_id {
    default                          "";
    "~^[A-Za-z0-9._:-]{1,64}$"       $http_x_consumer_id;
}

# Ключ API (X-Api-Key).
map $http_x_api_key $rl_api_key {
    default                          "";
    "~^[A-Za-z0-9._~-]{16,128}$"     $http_x_api_key;
}

################################################################################
## Зоны
## Активны только зоны, которые используются (location /api/ демо-сайта).
## Остальные — готовые заготовки: раскомментируйте зону вместе с примером
## ниже, иначе память под неё выделяется впустую.
################################################################################

# 1) Чувствительные операции (логин, пароль, 2FA): жёсткий лимит по IP.
# limit_req_zone $binary_remote_addr zone=app_login:10m          rate=5r/s;

# 2) Особо критичные endpoint'ы (отправка SMS-кодов).
# limit_req_zone $binary_remote_addr zone=security_sensitive:5m  rate=1r/s;

# 3) Публичный API по IP.
limit_req_zone $binary_remote_addr zone=public_api_ip:20m      rate=10r/s;

# 4) Публичный API по потребителю (X-Consumer-Id) — только вместе с зоной по IP.
# limit_req_zone $api_consumer_id    zone=public_api_user:20m    rate=120r/m;

# 5) Публичный API по ключу (X-Api-Key) — только вместе с зоной по IP.
# limit_req_zone $rl_api_key         zone=public_api_key:20m     rate=10r/s;

# 6) Административная зона.
# limit_req_zone $binary_remote_addr zone=admin_area:5m          rate=10r/s;

# 7) Внутренние клиенты: щадящий лимит против «сбежавших» клиентов.
# limit_req_zone $binary_remote_addr zone=internal_clients:10m   rate=200r/s;

# Одновременные соединения с одного IP.
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

################################################################################
## Примеры (server{}/location{})
################################################################################

## 1) Форма логина: сразу 429 при превышении.
# location = /login {
#     limit_req zone=app_login burst=5 nodelay;
#     proxy_pass http://backend_upstream;
# }

## 2) API: лимит по IP + по ключу (ротация ключей не поможет обойти лимит по IP).
# location ^~ /api/v2/ {
#     limit_conn perip_conn 50;
#     limit_req  zone=public_api_ip  burst=40 delay=20;
#     limit_req  zone=public_api_key burst=20 nodelay;
#     proxy_pass http://backend_upstream;
# }

## 3) Отправка SMS-кода.
# location = /auth/send_code {
#     limit_req zone=security_sensitive burst=1 nodelay;
#     proxy_pass http://backend_upstream;
# }

## 4) Админка: сначала только логируем превышения (dry run), потом включаем.
# server {
#     server_name admin.example.com;
#     limit_req_dry_run on;
#     location / {
#         limit_req zone=admin_area burst=20 delay=5;
#         proxy_pass http://backend_upstream;
#     }
# }

## 5) Внутренние сервисы.
# location /internal/ {
#     allow 10.0.0.0/8;
#     deny  all;
#     limit_req zone=internal_clients burst=500 delay=100;
#     proxy_pass http://backend_upstream;
# }
