##
# grpc_errors.conf — ошибки шлюза в формате gRPC (включать в location с grpc_pass).
#
# gRPC-клиент ждёт статус в trailer grpc-status, а не HTML-страницу. Без этого
# недоступный бэкенд выглядит для клиента как UNKNOWN/INTERNAL, и стандартные
# политики повторов не срабатывают. Здесь 502/503/504 превращаются в
# UNAVAILABLE (14), 429 — в RESOURCE_EXHAUSTED (8).
#
#     location /my.package.Service/ {
#         include /etc/nginx/snippets/grpc_errors.conf;
#         grpc_pass grpc://grpc_backend;
#     }
#
# Нужен также server-уровневый include snippets/grpc_error_locations.conf.
##
error_page 502 503 504 = /__grpc/unavailable;
error_page 429         = /__grpc/resource_exhausted;
