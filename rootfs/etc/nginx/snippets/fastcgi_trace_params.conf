##
# fastcgi_trace_params.conf — трассировка и адрес клиента для FastCGI (php-fpm).
#
# Подключайте ПОСЛЕ `include fastcgi_params;` в каждом location с fastcgi_pass
# (или используйте готовый snippets/fastcgi_php.conf). На уровне http{} эти
# параметры не задаются: первый же fastcgi_param в location отменил бы их все.
#
# Имена с префиксом HTTP_ — это то, что приложения читают как заголовки
# (PSR-7 getHeaderLine, Laravel/Symfony HeaderBag, $_SERVER['HTTP_X_REQUEST_ID']).
# Такой параметр заменяет одноимённый заголовок клиента, поэтому приложение
# видит проверенное значение шлюза, а не сырое клиентское.
##
fastcgi_param HTTP_X_REQUEST_ID         $trace_request_id;
fastcgi_param HTTP_X_PREV_REQUEST_ID    $local_request_id;
fastcgi_param HTTP_X_REQUEST_CHAIN      $request_hops_chain;
fastcgi_param HTTP_X_HOP_NAME           $hop_name;
fastcgi_param HTTP_X_MOBILE_LAUNCH_ID   $mobile_launch_id  if_not_empty;
fastcgi_param HTTP_X_MOBILE_REQUEST_ID  $mobile_request_id if_not_empty;

fastcgi_param HTTP_X_REAL_IP            $remote_addr;
fastcgi_param HTTP_X_FORWARDED_FOR      $proxy_x_forwarded_for;
fastcgi_param HTTP_X_FORWARDED_HOST     $host;
fastcgi_param HTTP_X_FORWARDED_PORT     $server_port;
fastcgi_param HTTP_X_FORWARDED_PREFIX   "";
fastcgi_param HTTP_X_FORWARDED_PROTO    $proxy_x_forwarded_proto;
fastcgi_param HTTP_FORWARDED            "";

# httpoxy (CVE-2016-5385): клиентский заголовок Proxy не должен стать HTTP_PROXY.
fastcgi_param HTTP_PROXY                "";
