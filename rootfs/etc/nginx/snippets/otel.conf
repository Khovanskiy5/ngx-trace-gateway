##
# otel.conf — трассировка OpenTelemetry (уровень http{}, по желанию).
#
# Требует модуль ngx_otel_module (modules-available/otel.conf). В отличие от
# режима по умолчанию (traceparent только читается), модуль создаёт спаны
# nginx и сам выставляет traceparent для бэкенда. Сквозной X-Request-ID и
# цепочка hop'ов продолжают работать как раньше.
##

otel_exporter {
    endpoint otel-collector:4317;   # OTLP/gRPC коллектора
}

otel_service_name ngx-trace-gateway;

# otel_trace on — записывать спан для КАЖДОГО запроса и передавать бэкенду
# флаг sampled=01, даже если клиент прислал 00 (решение родителя не
# сохраняется). Чтобы следовать решению родителя (parent-based sampling):
#     otel_trace $otel_parent_sampled;
# — тогда 00 и 01 проходят без изменений, а запросы без traceparent получают
# новую трассу с флагом 00. Долю трассируемых запросов можно задать
# переменной через split_clients.
# С `propagate` входящий traceparent продолжается (trace-id сохраняется,
# parent-id заменяется спаном nginx).
otel_trace         on;
otel_trace_context propagate;

# ID трассы и спана можно добавить в JSON-лог (global_logging.conf):
#   '"otel":{"trace_id":"$otel_trace_id","span_id":"$otel_span_id"},'
