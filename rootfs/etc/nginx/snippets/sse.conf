##
# sse.conf — Server-Sent Events и потоковые ответы (например, LLM-стриминг).
#
#     location /events/ {
#         include /etc/nginx/snippets/sse.conf;
#         proxy_pass http://backend_upstream;
#     }
#
# Бэкенд может и сам отключить буферизацию для конкретного ответа заголовком
# X-Accel-Buffering: no — тогда достаточно только таймаутов.
##
proxy_buffering     off;
proxy_cache         off;
proxy_read_timeout  1h;
proxy_next_upstream off;
gzip                off;   # сжатие буферизует поток
