##
# proxy_cache.conf — включить кэш для location с proxy_pass (по желанию).
#
#     location ^~ /api/catalog/ {
#         include /etc/nginx/snippets/proxy_cache.conf;
#         proxy_pass http://backend_upstream;
#     }
#
# Безопасные значения по умолчанию заданы в globals/global_proxy.conf и
# global_cache.conf:
#   - Cache-Control/Expires/Set-Cookie/Vary бэкенда учитываются: private,
#     no-store и ответы с Set-Cookie не кэшируются;
#   - запросы с Authorization или любыми Cookie идут мимо кэша ($cache_bypass),
#     поэтому персональные ответы не попадут другим пользователям, а токены —
#     в файлы кэша (ключ не содержит Authorization);
#   - stale-ответы при ошибках бэкенда, фоновое обновление, защита от
#     «thundering herd».
# Значения ниже применяются, только если бэкенд не прислал Cache-Control/Expires.
##
proxy_cache       appcache;
proxy_cache_valid 200 301 302 10m;
proxy_cache_valid 404         1m;
