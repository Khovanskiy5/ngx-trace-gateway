##
# proxy_headers.conf — заголовки запроса к бэкенду (proxy_pass) и скрытие
# заголовков ответа бэкенда, которые шлюз выставляет сам.
#
# Подключён на уровне http{} (globals/global_proxy.conf). Если в location{}
# нужен свой proxy_set_header или proxy_hide_header, подключите этот файл
# туда же — иначе пропадут ВСЕ заголовки ниже, включая Host и трассировку:
#
#     location /legacy/ {
#         include /etc/nginx/snippets/proxy_headers.conf;
#         proxy_set_header X-Legacy-Mode "1";
#         proxy_pass http://backend_upstream;
#     }
##

# --- Адресация и происхождение запроса ---------------------------------
# $host — одно из server_name (неизвестные Host отсекает catch-all сервер).
proxy_set_header Host               $host;
proxy_set_header X-Real-IP          $remote_addr;
# Клиентский X-Forwarded-For на edge отбрасывается (global_real_ip.conf).
proxy_set_header X-Forwarded-For    $proxy_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  $proxy_x_forwarded_proto;
proxy_set_header X-Forwarded-Host   $host;
proxy_set_header X-Forwarded-Port   $server_port;
# Заголовки, которые клиент мог подделать и которым доверяют фреймворки
# (TrustProxies, trusted_proxies, forward-headers-strategy): очищаем.
proxy_set_header Forwarded          "";
proxy_set_header X-Forwarded-Prefix "";
# httpoxy: клиентский Proxy не должен стать переменной окружения HTTP_PROXY.
proxy_set_header Proxy              "";

# --- WebSocket и keepalive ----------------------------------------------
# Для обычных запросов оба значения пустые и не отправляются, поэтому
# соединения с upstream переиспользуются (keepalive в upstream{}).
proxy_set_header Upgrade            $proxy_upgrade;
proxy_set_header Connection         $connection_upgrade;

# --- Трассировка (globals/global_trace.conf) -----------------------------
proxy_set_header X-HOP-Name          $hop_name;
proxy_set_header X-Request-ID        $trace_request_id;
proxy_set_header X-Request-Chain     $request_hops_chain;
# Вниз по цепочке «предыдущий» — это мы: отправляем свой local_request_id.
proxy_set_header X-Prev-Request-ID   $local_request_id;
proxy_set_header X-Mobile-Launch-ID  $mobile_launch_id;
proxy_set_header X-Mobile-Request-ID $mobile_request_id;
# traceparent и tracestate не трогаем: nginx передаёт их как пришли.

# --- Заголовки ответа бэкенда, которые выставляет шлюз -------------------
# Без этого в многоуровневой схеме (edge → api-nginx → backend) клиент
# получил бы по копии X-Request-ID и цепочки от каждого узла.
# Цепочку бэкенда шлюз использует сам ($trace_resp_chain в global_trace.conf).
proxy_hide_header X-Request-ID;
proxy_hide_header X-Request-Chain;
proxy_hide_header X-Prev-Request-ID;
proxy_hide_header X-HOP-Name;
proxy_hide_header X-Mobile-Launch-ID;
proxy_hide_header X-Mobile-Request-ID;
proxy_hide_header X-Proxy-Cache;
# Технологический стек бэкенда наружу не показываем.
proxy_hide_header X-Powered-By;
