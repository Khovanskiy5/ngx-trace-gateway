##
# grpc_headers.conf — метаданные запроса к gRPC-бэкенду (grpc_pass).
# Подключён на уровне http{} (globals/global_grpc.conf); при своём
# grpc_set_header или grpc_hide_header в location подключите файл туда же
# (правило «всё или ничего»).
##
grpc_set_header X-Real-IP           $remote_addr;
grpc_set_header X-Forwarded-For     $proxy_x_forwarded_for;
grpc_set_header X-Forwarded-Proto   $proxy_x_forwarded_proto;
grpc_set_header X-Forwarded-Host    $host;
grpc_set_header X-Forwarded-Port    $server_port;
grpc_set_header X-Forwarded-Prefix  "";
grpc_set_header Forwarded           "";
grpc_set_header Proxy               "";

grpc_set_header X-HOP-Name          $hop_name;
grpc_set_header X-Request-ID        $trace_request_id;
grpc_set_header X-Request-Chain     $request_hops_chain;
grpc_set_header X-Prev-Request-ID   $local_request_id;
grpc_set_header X-Mobile-Launch-ID  $mobile_launch_id;
grpc_set_header X-Mobile-Request-ID $mobile_request_id;

grpc_hide_header X-Request-ID;
grpc_hide_header X-Request-Chain;
grpc_hide_header X-Prev-Request-ID;
grpc_hide_header X-HOP-Name;
grpc_hide_header X-Mobile-Launch-ID;
grpc_hide_header X-Mobile-Request-ID;
grpc_hide_header X-Powered-By;
