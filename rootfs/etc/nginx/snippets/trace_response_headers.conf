##
# trace_response_headers.conf — заголовки трассировки в ответе клиенту.
# Переменные — в globals/global_trace.conf. Пустые значения nginx не
# отправляет: например, X-Mobile-* появятся, только если клиент их прислал.
# Подключайте через response_headers.conf, а не напрямую.
##

# Сквозной ID — всегда: по нему пользователь и поддержка находят запрос в логах.
add_header X-Request-ID        $trace_request_id always;

# Имя узла, цепочка и «кто был до меня» (X-Prev-Request-ID из запроса) —
# только доверенным клиентам ($trace_expose_internal, по умолчанию loopback):
# они раскрывают внутреннюю топологию.
add_header X-HOP-Name          $trace_resp_hop_name always;
add_header X-Request-Chain     $trace_resp_chain always;
add_header X-Prev-Request-ID   $trace_resp_prev_request_id always;

# Мобильные идентификаторы возвращаются как пришли.
add_header X-Mobile-Launch-ID  $mobile_launch_id always;
add_header X-Mobile-Request-ID $mobile_request_id always;

# Статус кэша (HIT, MISS, BYPASS …) — только если запрос шёл через proxy_cache.
add_header X-Proxy-Cache       $upstream_cache_status always;
