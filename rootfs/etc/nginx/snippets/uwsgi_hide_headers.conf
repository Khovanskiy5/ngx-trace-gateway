##
# uwsgi_hide_headers.conf — заголовки ответа приложения (uwsgi_pass),
# которые клиенту не передаются.
#
# Подключён на уровне http{} (globals/global_uwsgi.conf). Если в location
# нужен свой uwsgi_hide_header, подключите этот файл туда же — иначе
# (uwsgi_hide_header наследуется по правилу «всё или ничего») клиент
# снова получит X-Powered-By и копии заголовков трассировки от приложения.
##

# Технологический стек приложения наружу не показываем.
uwsgi_hide_header X-Powered-By;

# Заголовки трассировки в ответе выставляет шлюз; копии приложения скрываем,
# иначе клиент получил бы их дважды. Цепочку приложения шлюз использует сам
# ($trace_resp_chain в global_trace.conf).
uwsgi_hide_header X-Request-ID;
uwsgi_hide_header X-Request-Chain;
uwsgi_hide_header X-Prev-Request-ID;
uwsgi_hide_header X-HOP-Name;
uwsgi_hide_header X-Mobile-Launch-ID;
uwsgi_hide_header X-Mobile-Request-ID;
uwsgi_hide_header X-Proxy-Cache;
