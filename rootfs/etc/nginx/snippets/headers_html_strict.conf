##
# headers_html_strict.conf — строгий профиль для HTML-приложений (по желанию).
#
# Не включён глобально: CSP, COOP/COEP/CORP зависят от конкретного приложения
# и легко ломают встраивание, OAuth-попапы, CDN-ресурсы. Подключайте в server{}
# или location{} своего приложения и настраивайте CSP под него:
#
#     location / {
#         include /etc/nginx/snippets/headers_html_strict.conf;
#         ...
#     }
#
# Файл сам подключает response_headers.conf (правило «всё или ничего»).
# Значения — по OWASP Secure Headers Project.
##
include /etc/nginx/snippets/response_headers.conf;

# Referrer-Policy: no-referrer вместо strict-origin-when-cross-origin
# (см. комментарий к map в global_security.conf).
set $referrer_policy_profile strict;

add_header Content-Security-Policy "default-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# COEP require-corp запрещает загрузку любых сторонних ресурсов без CORP/CORS.
# add_header Cross-Origin-Embedder-Policy "require-corp" always;
