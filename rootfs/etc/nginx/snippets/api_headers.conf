##
# api_headers.conf — заголовки ответа для location API.
#
# OWASP REST Security Cheat Sheet: ответы API по умолчанию не должны
# кэшироваться браузером и промежуточными кэшами. Cache-Control: no-store
# добавляется, только если бэкенд не прислал свой Cache-Control
# (map $api_cache_control в globals/global_security.conf).
# Свой add_header → общий набор подключается здесь же («всё или ничего»).
##
include /etc/nginx/snippets/response_headers.conf;
add_header Cache-Control $api_cache_control always;
