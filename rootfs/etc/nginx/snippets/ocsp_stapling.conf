##
# ocsp_stapling.conf — OCSP stapling (server{} с TLS, по желанию).
#
# По умолчанию выключен: Let's Encrypt с 2025 года не выпускает сертификаты
# с OCSP-адресом и отключил OCSP-респондеры, а CA/B Forum сделал OCSP
# необязательным. Для таких сертификатов stapling лишь пишет предупреждение.
# Включайте только для CA, которые OCSP поддерживают. Несовместим с
# ssl_certificate_compression (nginx ≥ 1.29.3 и Angie откажутся стартовать).
##
ssl_stapling            on;
ssl_stapling_verify     on;
ssl_trusted_certificate /etc/nginx/ssl/chain.pem;   # цепочка CA для проверки ответа

# DNS для запросов к OCSP-респондеру берётся из conf.d/globals/global_resolver.conf.
