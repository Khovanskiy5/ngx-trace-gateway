##
# http3.conf — HTTP/3 (QUIC) для HTTPS-сервера (по желанию, экспериментально).
#
# Требования: nginx ≥ 1.30.5 / 1.31.6 или Angie ≥ 1.12.2 (в них исправлены
# уязвимости HTTP/3 2026 года; OpenResty 1.31.1.1 их ещё не содержит),
# OpenSSL ≥ 3.5.1, опубликованный UDP-порт (443:443/udp в compose.yaml).
# В catch-all сервере раскомментируйте `listen 443 quic reuseport default_server`
# (reuseport указывается один раз на адрес:порт).
#
# Подключайте в server{} с TLS. Заголовок Alt-Svc добавляет общий набор
# (snippets/security_headers.conf) — поэтому он есть и на API, и на страницах
# ошибок. Порт в Alt-Svc должен совпадать с внешним портом.
##
listen 443 quic;
listen [::]:443 quic;
http3 on;
set $alt_svc 'h3=":443"; ma=86400';
