##
# scgi_hide_headers.conf — заголовки ответа приложения (scgi_pass),
# которые клиенту не передаются.
#
# Подключён на уровне http{} (globals/global_scgi.conf). Если в location
# нужен свой scgi_hide_header, подключите этот файл туда же — иначе
# (scgi_hide_header наследуется по правилу «всё или ничего») клиент
# снова получит X-Powered-By и копии заголовков трассировки от приложения.
##

# Технологический стек приложения наружу не показываем.
scgi_hide_header X-Powered-By;

# Заголовки трассировки в ответе выставляет шлюз; копии приложения скрываем,
# иначе клиент получил бы их дважды. Цепочку приложения шлюз использует сам
# ($trace_resp_chain в global_trace.conf).
scgi_hide_header X-Request-ID;
scgi_hide_header X-Request-Chain;
scgi_hide_header X-Prev-Request-ID;
scgi_hide_header X-HOP-Name;
scgi_hide_header X-Mobile-Launch-ID;
scgi_hide_header X-Mobile-Request-ID;
scgi_hide_header X-Proxy-Cache;
