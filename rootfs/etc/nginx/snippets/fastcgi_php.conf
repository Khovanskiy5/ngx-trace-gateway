##
# fastcgi_php.conf — типовой location для PHP через php-fpm.
#
#     location ~ \.php$ {
#         include /etc/nginx/snippets/fastcgi_php.conf;
#         fastcgi_pass php-fpm:9000;
#     }
#
# Не забудьте убрать из сайта «заглушку» для .php (sites-available/default/app_locations.conf).
##

# Отдаём в php-fpm только существующие скрипты: иначе /upload/x.jpg/y.php
# может выполнить загруженный файл.
try_files $fastcgi_script_name =404;

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
include /etc/nginx/snippets/fastcgi_trace_params.conf;
