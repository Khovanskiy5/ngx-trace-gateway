##
# websocket.conf — долгоживущие WebSocket-соединения (включать в location).
# Upgrade/Connection для WebSocket уже выставляются глобально
# (snippets/proxy_headers.conf), здесь только таймауты. Скалярные директивы
# не сбрасывают унаследованные proxy_set_header.
#
#     location /ws/ {
#         include /etc/nginx/snippets/websocket.conf;
#         proxy_pass http://backend_upstream;
#     }
#
# После reload/остановки соединения закрываются не позже worker_shutdown_timeout
# (nginx.conf) — клиенты должны уметь переподключаться.
##
proxy_read_timeout  1h;   # простой без сообщений; держите ping/pong в приложении чаще
proxy_send_timeout  1h;
proxy_next_upstream off;  # рукопожатие не повторяем на другом сервере
