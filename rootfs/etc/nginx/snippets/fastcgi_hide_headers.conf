##
# fastcgi_hide_headers.conf — заголовки ответа приложения (fastcgi_pass),
# которые клиенту не передаются.
#
# Подключён на уровне http{} (globals/global_fastcgi.conf). Если в location
# нужен свой fastcgi_hide_header, подключите этот файл туда же — иначе
# (fastcgi_hide_header наследуется по правилу «всё или ничего») клиент
# снова получит X-Powered-By и копии заголовков трассировки от приложения.
##

# Технологический стек приложения наружу не показываем.
fastcgi_hide_header X-Powered-By;

# Заголовки трассировки в ответе выставляет шлюз; копии приложения скрываем,
# иначе клиент получил бы их дважды. Цепочку приложения шлюз использует сам
# ($trace_resp_chain в global_trace.conf).
fastcgi_hide_header X-Request-ID;
fastcgi_hide_header X-Request-Chain;
fastcgi_hide_header X-Prev-Request-ID;
fastcgi_hide_header X-HOP-Name;
fastcgi_hide_header X-Mobile-Launch-ID;
fastcgi_hide_header X-Mobile-Request-ID;
fastcgi_hide_header X-Proxy-Cache;
