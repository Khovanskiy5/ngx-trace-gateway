##
# response_headers.conf — все «постоянные» заголовки ответа: безопасность и трассировка.
#
# Подключён на уровне http{} (globals/global_security.conf). Если в server{}
# или location{} появляется хотя бы один свой add_header, подключите этот
# файл туда же ПЕРЕД своими заголовками — иначе nginx молча выбросит все
# унаследованные add_header (правило «всё или ничего»):
#
#     location /downloads/ {
#         include /etc/nginx/snippets/response_headers.conf;
#         add_header Content-Disposition "attachment" always;
#     }
##
include /etc/nginx/snippets/security_headers.conf;
include /etc/nginx/snippets/trace_response_headers.conf;
