##
# hotlink_protection.conf — запрет встраивания картинок на чужих сайтах (по желанию).
# Подключайте в location со статикой:
#
#     location ~* \.(?:jpg|jpeg|png|gif|webp|avif)$ {
#         include /etc/nginx/snippets/hotlink_protection.conf;
#         expires 30d;
#     }
#
# Разрешены запросы без Referer, с вырезанным прокси Referer и с имён текущего
# server{} (server_names). Свои домены и CDN добавьте в список.
##
valid_referers none blocked server_names;
if ($invalid_referer) {
    return 403;
}
