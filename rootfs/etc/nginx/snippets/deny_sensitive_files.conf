##
# deny_sensitive_files.conf — запрет доступа к служебным файлам (server{}).
#
# Используется `return 403`, а не `deny all`: статус тот же, но nginx не пишет
# строку в error_log (сканеры, перебирающие /.env и /.git, иначе засыпали бы
# его неотмаскированными запросами).
#
# Подключайте раньше location со статикой: nginx проверяет location с регулярными
# выражениями в порядке их появления, и первое совпадение побеждает. Если
# location для статики (\.css|\.js|…) окажется выше, /.hidden.css или
# /backup/.env.js уйдут мимо этих правил.
# Location с модификатором ^~ (например, /api/) регулярные выражения не
# проверяют — такие запросы обрабатывает бэкенд.
##

# Скрытые файлы и каталоги (.git, .env, .htaccess, .svn …), кроме /.well-known/.
location ~ /\.(?!well-known/) {
    return 403;
}

# Резервные копии, дампы, ключи, файлы редакторов.
location ~* (?:\.(?:bak|backup|old|orig|save|swp|swo|tmp|sql|sqlite|sqlite3|db|env|ini|log|pem|key|p12|pfx)|~)$ {
    return 403;
}

# Конфигурация популярных PHP-приложений и менеджеров зависимостей.
location ~* /(?:composer\.(?:json|lock)|wp-config\.php|configuration\.php|settings\.php|config\.php|php\.ini|web\.config)$ {
    return 403;
}

# Каталоги загрузок: хранить файлы можно, выполнять скрипты — нельзя.
location ~* ^/uploads?/.*\.(?:php[0-9]?|phtml|phar|pl|py|cgi|sh|jsp|aspx?)$ {
    return 403;
}
