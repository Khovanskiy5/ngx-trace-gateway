##
# error_pages.conf — страницы ошибок (подключается на уровне server{} ПЕРВЫМ).
#
# Формат выбирает map $error_page_uri (globals/global_error_pages.conf):
#   HTML — один шаблон /var/www/errors/public/error.html для всех кодов; код,
#          заголовок, описание и ID запроса подставляет SSI;
#   JSON — RFC 9457 Problem Details (application/problem+json) для /api/ и
#          клиентов, которые просят JSON.
# Статус ответа остаётся исходным, ответы ошибок попадают в access-лог.
# Ответы бэкенда (включая его собственные 4xx/5xx) проходят без изменений:
# proxy_intercept_errors выключен, здесь только ошибки самого шлюза.
##

# Поля uri и args JSON-лога вычисляются здесь — до любых return в фазе
# rewrite и до внутреннего редиректа на страницу ошибки — и кэшируются на
# весь запрос. Иначе в логе оказался бы /__errors/… без query-строки.
if ($log_request_snapshot) {
}

error_page 400 403 404 405 413 414 429 494 500 502 503 504 $error_page_uri;

location ^~ /__errors/ {
    internal;
    alias /var/www/errors/public/;

    charset utf-8;
    ssi     on;

    # Лимит тела уже проверен в исходном location; при HTTP/2 nginx проверил
    # бы его здесь повторно и вместо этой страницы отдал бы встроенную.
    client_max_body_size 0;

    # Свои add_header → повторно подключаем общий набор («всё или ничего»).
    include /etc/nginx/snippets/response_headers.conf;
    add_header Cache-Control "no-store" always;
    # RFC 9110: в ответе 405 обязателен заголовок Allow.
    add_header Allow $error_allow always;
}

# JSON-вариант (RFC 9457). error_page без «=» сохраняет исходный код,
# $status подставляется в тело. URI без расширения: иначе тип ответа
# определился бы по «.json» из mime.types, а не по default_type.
location = /__errors/api {
    internal;
    default_type application/problem+json;
    client_max_body_size 0;

    include /etc/nginx/snippets/response_headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Allow $error_allow always;

    return 200 '{"type":"about:blank","title":"$error_title_en","status":$status,"request_id":"$trace_request_id"}\n';
}
