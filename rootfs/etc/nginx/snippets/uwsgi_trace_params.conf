##
# uwsgi_trace_params.conf — трассировка и адрес клиента для uWSGI.
# Подключайте ПОСЛЕ `include uwsgi_params;` в каждом location с uwsgi_pass:
#
#     location / {
#         include uwsgi_params;
#         include /etc/nginx/snippets/uwsgi_trace_params.conf;
#         uwsgi_pass django:3031;
#     }
#
# HTTP_*-имена приложение (Django request.META, Flask request.headers) видит
# как заголовки; они заменяют одноимённые заголовки клиента.
##
uwsgi_param HTTP_X_REQUEST_ID         $trace_request_id;
uwsgi_param HTTP_X_PREV_REQUEST_ID    $local_request_id;
uwsgi_param HTTP_X_REQUEST_CHAIN      $request_hops_chain;
uwsgi_param HTTP_X_HOP_NAME           $hop_name;
uwsgi_param HTTP_X_MOBILE_LAUNCH_ID   $mobile_launch_id  if_not_empty;
uwsgi_param HTTP_X_MOBILE_REQUEST_ID  $mobile_request_id if_not_empty;

uwsgi_param HTTP_X_REAL_IP            $remote_addr;
uwsgi_param HTTP_X_FORWARDED_FOR      $proxy_x_forwarded_for;
uwsgi_param HTTP_X_FORWARDED_HOST     $host;
uwsgi_param HTTP_X_FORWARDED_PORT     $server_port;
uwsgi_param HTTP_X_FORWARDED_PREFIX   "";
uwsgi_param HTTP_X_FORWARDED_PROTO    $proxy_x_forwarded_proto;
uwsgi_param HTTP_FORWARDED            "";

# httpoxy
uwsgi_param HTTP_PROXY                "";
