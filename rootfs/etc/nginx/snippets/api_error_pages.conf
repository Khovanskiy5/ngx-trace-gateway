##
# api_error_pages.conf — принудительно JSON-ошибки (RFC 9457) в location.
#
# Для /api/ и клиентов с Accept: application/json это уже делает map
# $error_page_uri (globals/global_error_pages.conf). Этот snippet нужен для
# API под другими префиксами, если не хотите менять map:
#
#     location ^~ /v1/ {
#         include /etc/nginx/snippets/api_error_pages.conf;
#         proxy_pass http://backend_upstream;
#     }
#
# Нужен server-уровневый snippets/error_pages.conf (там location /__errors/api).
##
error_page 400 403 404 405 413 414 429 494 500 502 503 504 /__errors/api;
