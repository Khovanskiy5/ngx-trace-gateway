##
# scgi_trace_params.conf — трассировка и адрес клиента для SCGI.
# Подключайте ПОСЛЕ `include scgi_params;` в каждом location со scgi_pass.
##
scgi_param HTTP_X_REQUEST_ID         $trace_request_id;
scgi_param HTTP_X_PREV_REQUEST_ID    $local_request_id;
scgi_param HTTP_X_REQUEST_CHAIN      $request_hops_chain;
scgi_param HTTP_X_HOP_NAME           $hop_name;
scgi_param HTTP_X_MOBILE_LAUNCH_ID   $mobile_launch_id  if_not_empty;
scgi_param HTTP_X_MOBILE_REQUEST_ID  $mobile_request_id if_not_empty;

scgi_param HTTP_X_REAL_IP            $remote_addr;
scgi_param HTTP_X_FORWARDED_FOR      $proxy_x_forwarded_for;
scgi_param HTTP_X_FORWARDED_HOST     $host;
scgi_param HTTP_X_FORWARDED_PORT     $server_port;
scgi_param HTTP_X_FORWARDED_PREFIX   "";
scgi_param HTTP_X_FORWARDED_PROTO    $proxy_x_forwarded_proto;
scgi_param HTTP_FORWARDED            "";

# httpoxy
scgi_param HTTP_PROXY                "";
