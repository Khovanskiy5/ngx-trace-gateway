##
# grpc_error_locations.conf — внутренние location для snippets/grpc_errors.conf.
# Подключается один раз на уровне server{} с gRPC.
#
# Ответ — 200 с Content-Type application/grpc и статусом в grpc-status
# (Trailers-Only по спецификации gRPC). Код 204 не годится: для него nginx
# убирает Content-Type, а grpc-go и grpcurl считают любой статус, кроме 200,
# ошибкой HTTP и возвращают UNKNOWN вместо UNAVAILABLE.
##
location = /__grpc/unavailable {
    internal;
    include /etc/nginx/snippets/response_headers.conf;
    default_type application/grpc;
    add_header grpc-status 14 always;
    add_header grpc-message "unavailable" always;
    return 200 "";
}

location = /__grpc/resource_exhausted {
    internal;
    include /etc/nginx/snippets/response_headers.conf;
    default_type application/grpc;
    add_header grpc-status 8 always;
    add_header grpc-message "resource exhausted" always;
    return 200 "";
}
