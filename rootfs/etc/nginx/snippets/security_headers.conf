##
# security_headers.conf — базовые заголовки безопасности.
# Значения вычисляются в globals/global_security.conf: если бэкенд прислал
# свой заголовок, переменная пустая и nginx его не дублирует
# (add_header с пустым значением не отправляется).
# Подключайте через response_headers.conf, а не напрямую.
##
add_header X-Content-Type-Options            $security_x_content_type_options always;
add_header X-Frame-Options                   $security_x_frame_options always;
add_header Referrer-Policy                   $security_referrer_policy always;
add_header Permissions-Policy                $security_permissions_policy always;
add_header X-Permitted-Cross-Domain-Policies $security_x_permitted_cross_domain_policies always;
add_header X-XSS-Protection                  $security_x_xss_protection always;
add_header Retry-After                       $security_retry_after always;
add_header Strict-Transport-Security         $security_strict_transport_security always;
add_header Alt-Svc                           $alt_svc always;
