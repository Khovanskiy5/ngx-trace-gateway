##
# acme_challenge.conf — проверка HTTP-01 для Let's Encrypt и других ACME-CA (server{} на 80 порту).
#
# certbot/lego в режиме webroot кладут токены в /var/www/acme/.well-known/acme-challenge/.
# Для выпуска сертификата смонтируйте /var/www/acme на запись и общим томом
# с ACME-клиентом. Модификатор ^~ исключает регулярные location, а map
# $canonical_redirect пропускает /.well-known/, так что токен (без расширения)
# не получит редирект.
##
location ^~ /.well-known/acme-challenge/ {
    root         /var/www/acme;
    default_type text/plain;
    try_files    $uri =404;
}
