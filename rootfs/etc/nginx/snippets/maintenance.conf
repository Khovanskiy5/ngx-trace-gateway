##
# maintenance.conf — режим обслуживания (server{}).
#
# Включить:  touch rootfs/var/www/maintenance/on   (действует сразу)
# Выключить: rm rootfs/var/www/maintenance/on      (до 30 с — столько
#            open_file_cache помнит, что файл существует; `make reload` — сразу)
# Все запросы получают 503 со страницей ошибки и Retry-After (кроме ACME и
# внутренних страниц ошибок). Служебный /healthz на 127.0.0.1:8080 продолжает
# отвечать 200 — контейнер не будет считаться «нездоровым».
##
set $maintenance "";
if (-f /var/www/maintenance/on) {
    set $maintenance "1";
}
if ($uri ~ "^/(?:__errors/|\.well-known/acme-challenge/)") {
    set $maintenance "";
}
if ($maintenance) {
    return 503;
}
