# ===================================================================
#  Главный конфигурационный файл (nginx / OpenResty / Angie)
# ===================================================================
#  Один и тот же файл подходит для всех трёх дистрибутивов. compose.yaml
#  монтирует ./rootfs/etc/nginx в /etc/nginx целиком (каталог, а не отдельные
#  файлы — так правки с «атомарным» сохранением сразу видны в контейнере)
#  и запускает бинарник так:
#
#      <nginx|openresty|angie> -c /etc/nginx/nginx.conf \
#          -g "daemon off; worker_processes auto; pid /run/nginx.pid;"
#
#  Относительные include (mime.types, *_params) разрешаются от каталога этого
#  файла, поэтому их копии лежат рядом, в /etc/nginx.
#
#  Намеренно НЕ задаём здесь:
#    user             — у каждого образа свой скомпилированный пользователь
#                       (nginx → nginx, OpenResty → nobody, Angie → angie);
#    worker_processes — передаётся через -g из compose (NGX_WORKER_PROCESSES).
#                       «auto» считает CPU хоста, а не квоту контейнера, поэтому
#                       при лимите CPU задайте число явно;
#    pid              — передаётся через -g (NGX_PID). Без -g используется путь,
#                       вкомпилированный в бинарник, — так удобно при запуске
#                       без Docker.
#  Если запускаете без compose, добавьте нужные значения сами:
#      nginx -c /etc/nginx/nginx.conf -g "worker_processes auto;"
# ===================================================================

# Лимит дескрипторов на воркер. Каждое проксируемое соединение занимает два fd
# (клиент и upstream), плюс файлы, поэтому значение должно быть не меньше
# 2 × worker_connections. В compose.yaml ulimits выставлены так же.
worker_rlimit_nofile    65535;

# Верхняя граница «мягкой» остановки и reload: старые воркеры, у которых ещё
# висят долгие запросы (WebSocket, SSE, загрузки), будут закрыты через 25 с.
# stop_grace_period в compose.yaml должен быть больше (30 с).
worker_shutdown_timeout 25s;

# Ошибки — в stderr: в контейнере они попадают в `docker compose logs`.
# ВНИМАНИЕ: в отличие от JSON access-лога, error_log не маскирует данные:
# строки [warn]/[error] (ошибки бэкенда, 413, срабатывания limit_req)
# содержат исходную строку запроса с query, адрес upstream и Referer.
# Храните этот поток так же осторожно, как секреты, или поднимите уровень
# до error.
error_log stderr warn;

# JIT для регулярных выражений (map, location ~, if).
pcre_jit on;

# Динамические модули (load_module) — только в главном контексте, до http{}.
# По умолчанию каталог пуст; пример — modules-available/otel.conf
# (OpenTelemetry для образов nginx *-otel и Angie).
include /etc/nginx/modules-enabled/*.conf;

# Блоки events{} и http{} лежат в main.d/, а не в conf.d/: стоковая
# конфигурация OpenResty подключает /etc/nginx/conf.d/*.conf внутрь своего
# http{}, и блоки главного уровня там вызвали бы ошибку.
include /etc/nginx/main.d/events.conf;
include /etc/nginx/main.d/http.conf;

# Документация по модулю ядра: https://nginx.org/ru/docs/ngx_core_module.html
