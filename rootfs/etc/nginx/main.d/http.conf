# ===================================================================
#  HTTP-блок
# ===================================================================
#  Базовые настройки HTTP и подключение глобальных модулей из
#  conf.d/globals/. В globals/ лежат только директивы уровня http{}: map,
#  зоны, значения по умолчанию. Всё, что работает внутри server{}/location{},
#  вынесено в /etc/nginx/snippets/ и подключается там явно; серверы (включая
#  служебный на 127.0.0.1:8080) — в sites-available/.
#
#  ВАЖНО: правило наследования nginx «всё или ничего».
#  add_header, proxy_set_header, proxy_hide_header, grpc_set_header,
#  grpc_hide_header, fastcgi_param/uwsgi_param/scgi_param,
#  fastcgi_hide_header/uwsgi_hide_header/scgi_hide_header и error_page
#  наследуются с верхнего уровня, только если на текущем уровне нет ни одной
#  директивы того же типа. Поэтому в server{}/location{} со своей директивой
#  повторно подключайте соответствующий snippet:
#    add_header                       → snippets/response_headers.conf
#    proxy_set_header/proxy_hide_header → snippets/proxy_headers.conf
#    grpc_set_header/grpc_hide_header → snippets/grpc_headers.conf
#    fastcgi_hide_header (uwsgi_, scgi_) → snippets/fastcgi_hide_headers.conf (…)
#    fastcgi_param (uwsgi_, scgi_)    → snippets/fastcgi_trace_params.conf (…)
#  scripts/lint.sh проверяет это для каждого блока.
#  (В nginx ≥ 1.29.3 есть add_header_inherit merge, но OpenResty < 1.31 и
#  Angie его не поддерживают, поэтому шаблон на него не опирается.)
# ===================================================================

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Location в редиректах — относительный («/path»). Браузер сам подставит
    # схему, хост и порт, по которым пришёл. Это чинит потерю порта при
    # публикации контейнера на нестандартном порту и понижение https→http за
    # балансировщиком, который снимает TLS.
    absolute_redirect off;

    # charset utf-8 НЕ задаём глобально: иначе nginx припишет «charset=utf-8»
    # к проксируемым ответам без charset (например, windows-1251 от старого
    # бэкенда). Кодировка задаётся только там, где nginx отдаёт свои файлы.

    # -------------------------------------------------------------------
    #  Upgrade/Connection для проксирования
    # -------------------------------------------------------------------
    # Пробрасываем только WebSocket-апгрейд. Любые другие значения Upgrade
    # (например, h2c) отбрасываются: иначе бэкенд, принявший h2c, превращает
    # nginx в «слепой» TCP-туннель в обход всех правил (h2c smuggling).
    map $http_upgrade $proxy_upgrade {
        default          "";
        "~*^websocket$"  $http_upgrade;
    }

    # Connection: upgrade — только для WebSocket. Для обычных запросов значение
    # пустое, а пустой proxy_set_header nginx не отправляет вовсе. Благодаря
    # этому работает keepalive к upstream (раньше здесь было «close», и каждый
    # запрос открывал новое TCP-соединение).
    map $proxy_upgrade $connection_upgrade {
        default  upgrade;
        ""       "";
    }

    # -------------------------------------------------------------------
    #  Временные файлы — один каталог для всех дистрибутивов
    # -------------------------------------------------------------------
    # /var/cache/nginx в compose.yaml — именованный том. Родительский каталог
    # должен существовать: nginx создаёт только последний компонент пути и сам
    # выставляет владельца (пользователя воркеров).
    client_body_temp_path /var/cache/nginx/client_temp;

    # -------------------------------------------------------------------
    #  Глобальные модули. Порядок важен только для читаемости: переменные
    #  из map вычисляются лениво, в момент первого использования.
    # -------------------------------------------------------------------
    include /etc/nginx/conf.d/globals/global_real_ip.conf;     # Реальный IP клиента за балансировщиком (выключено по умолчанию)
    include /etc/nginx/conf.d/globals/global_resolver.conf;    # DNS для имён, которые резолвятся во время работы
    include /etc/nginx/conf.d/globals/global_hop_name.conf;    # $hop_name / $hop_physical / $service_name
    include /etc/nginx/conf.d/globals/global_trace.conf;       # Трассировка: валидация входящих ID, цепочка hop'ов, traceparent
    include /etc/nginx/conf.d/globals/global_logging.conf;     # JSON-лог structured_log → stdout
    include /etc/nginx/conf.d/globals/global_tcp.conf;         # TCP, keepalive, таймауты и лимиты клиента
    include /etc/nginx/conf.d/globals/global_security.conf;    # server_tokens, заголовки безопасности, URL-канонизация
    include /etc/nginx/conf.d/globals/global_ssl.conf;         # TLS-политика (TLSRef/Mozilla intermediate)
    include /etc/nginx/conf.d/globals/global_gzip.conf;        # gzip
    include /etc/nginx/conf.d/globals/global_cache.conf;       # Зона proxy_cache (кэш включается точечно), open_file_cache
    include /etc/nginx/conf.d/globals/global_rate_limit.conf;  # Зоны limit_req/limit_conn, статус 429
    include /etc/nginx/conf.d/globals/global_proxy.conf;       # proxy_*: таймауты, буферы, заголовки, TLS к upstream
    include /etc/nginx/conf.d/globals/global_grpc.conf;        # grpc_*: таймауты и заголовки трассировки
    include /etc/nginx/conf.d/globals/global_fastcgi.conf;     # fastcgi_*: таймауты и буферы (параметры — в snippets/)
    include /etc/nginx/conf.d/globals/global_uwsgi.conf;       # uwsgi_*: таймауты и буферы
    include /etc/nginx/conf.d/globals/global_scgi.conf;        # scgi_*: таймауты и буферы
    include /etc/nginx/conf.d/globals/global_error_pages.conf; # Выбор и тексты страниц ошибок (HTML и JSON)

    # OpenTelemetry (только образы nginx *-otel и Angie; см. snippets/otel.conf):
    # include /etc/nginx/snippets/otel.conf;

    # -------------------------------------------------------------------
    #  Виртуальные хосты
    # -------------------------------------------------------------------
    # sites-enabled/*.conf — обычные файлы с одной строкой include на нужный
    # файл из sites-available/ (без символьных ссылок: они ломаются при
    # checkout в Windows). Файлы подключаются в алфавитном порядке:
    #   00-catch-all.conf — сервер по умолчанию для неизвестных Host/SNI;
    #   01-status.conf    — служебный сервер 127.0.0.1:8080 (/healthz, /nginx_status);
    #   default.conf      — демо-сайт.
    include /etc/nginx/sites-enabled/*.conf;
}
