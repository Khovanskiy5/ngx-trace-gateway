# ===================================================================
#  Блок событий (events)
# ===================================================================
#  Сколько соединений может обслуживать каждый воркер. Метод обработки
#  событий nginx выбирает сам (epoll в Linux, kqueue в macOS/BSD), поэтому
#  директива `use` не нужна и только мешает переносимости.
# ===================================================================

events {
    # Максимум одновременных соединений на воркер (клиентские + к upstream).
    # Должно быть меньше worker_rlimit_nofile / 2 (см. nginx.conf).
    worker_connections 10240;

    # multi_accept on — компромисс, а не «лучшая практика»: воркер забирает
    # сразу все новые соединения, что при всплесках может перекосить нагрузку
    # между воркерами. Включайте только после нагрузочного теста.
    # multi_accept on;
}
